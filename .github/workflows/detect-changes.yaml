name: Detect Changes & Build Matrix

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to the service configuration JSON file"
        required: true
        type: string
    outputs:
      matrix:
        description: "Filtered JSON matrix ({\"items\": [...]}) containing only changed items"
        value: ${{ jobs.filter-matrix.outputs.matrix }}

jobs:
  filter-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0

      - name: Generate Filtered Matrix
        id: set-matrix
        run: |
          CONFIG_FILE="${{ inputs.config-file }}"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Configuration file $CONFIG_FILE not found!"
            exit 1
          fi

          # Determine the correct git diff boundary based on the event type,
          # so this filters against THIS push/PR's own changes — not
          # against whatever the last run on this branch happened to be,
          # which matters the moment two people push around the same time.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Exact PR base SHA vs head SHA from the webhook payload.
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            DIFF_COMMAND="git diff --name-only $BASE_SHA $HEAD_SHA"

          elif [ "${{ github.event_name }}" == "push" ]; then
            # Exact commit range from the push payload — handles multiple
            # commits in one push correctly, unlike diffing only the
            # single most recent commit.
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
              # New branch with no prior commit to diff against.
              DIFF_COMMAND="git diff --name-only HEAD~1 HEAD"
            else
              DIFF_COMMAND="git diff --name-only $BEFORE $AFTER"
            fi

          else
            # workflow_dispatch or any other manually-triggered event.
            DIFF_COMMAND="git diff --name-only HEAD~1 HEAD"
          fi

          echo "Running diff command: $DIFF_COMMAND"
          CHANGED_FILES=$($DIFF_COMMAND || git diff --name-only HEAD~1 HEAD)

          LENGTH=$(jq '.items | length' "$CONFIG_FILE")
          CHANGED_ITEMS="[]"

          for ((i=0; i<LENGTH; i++)); do
            NAME=$(jq -r ".items[$i].name" "$CONFIG_FILE")
            PATH_VAL=$(jq -r ".items[$i].path" "$CONFIG_FILE")
            JOB_SPEC=$(jq -r ".items[$i].job_spec" "$CONFIG_FILE")
            OCTOPUS_PROJECT=$(jq -r ".items[$i].octopus_project" "$CONFIG_FILE")

            # Check if any changed file starts with this item's path OR
            # matches its job spec exactly. Path-only matching missed a
            # real case: editing only the job spec (e.g. a CPU/memory
            # value now living directly in the .nomad.hcl file) never
            # touches anything under `path`, so it silently wouldn't
            # have been detected as a change at all.
            if echo "$CHANGED_FILES" | grep -q "^$PATH_VAL" || echo "$CHANGED_FILES" | grep -qxF "$JOB_SPEC"; then
              echo "Changes detected for $NAME (path: $PATH_VAL, job_spec: $JOB_SPEC)"

              ITEM=$(jq -n \
                --arg name "$NAME" \
                --arg path "$PATH_VAL" \
                --arg job_spec "$JOB_SPEC" \
                --arg octopus_project "$OCTOPUS_PROJECT" \
                '{name: $name, path: $path, job_spec: $job_spec, octopus_project: $octopus_project}')

              CHANGED_ITEMS=$(echo "$CHANGED_ITEMS" | jq --argjson item "$ITEM" '. + [$item]')
            else
              echo "No changes for $NAME ($PATH_VAL), skipping."
            fi
          done

          FINAL_MATRIX=$(jq -cn --argjson items "$CHANGED_ITEMS" '{items: $items}')

          echo "Generated Matrix: $FINAL_MATRIX"
          echo "matrix=$FINAL_MATRIX" >> "$GITHUB_OUTPUT"
