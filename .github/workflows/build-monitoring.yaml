name: build-monitoring

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      # Explicit files, not nomad-jobs/monitoring/** — that folder also
      # holds node-exporter.nomad.hcl (owned by deploy-platform-jobs.yaml,
      # no build step at all).
      - "nomad-jobs/monitoring/prometheus.nomad.hcl"
      - "nomad-jobs/monitoring/loki.nomad.hcl"
      - "nomad-jobs/monitoring/alloy.nomad.hcl"
      - "nomad-jobs/monitoring/metrics-api.nomad.hcl"
      - "nomad-jobs/monitoring/nomad-sentinel.nomad.hcl"
      - "nomad-jobs/security/falco-webhook.nomad.hcl"

permissions:
  id-token: write # Cosign keyless signing + Vault OIDC + Octopus OIDC login
  contents: read

env:
  REGION: ${{ vars.REGION }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
  CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
  REGISTRY_HOST: ${{ vars.REGION }}-docker.pkg.dev
  IMAGE_REGISTRY_PATH: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}

jobs:
  get-matrix:
    uses: ./.github/workflows/detect-changes.yaml
    with:
      config-file: ".github/configs/monitoring-tools.json"

  split-nomad-sentinel:
    needs: get-matrix
    runs-on: ubuntu-24.04
    outputs:
      other_tools: ${{ steps.split.outputs.other_tools }}
      nomad_sentinel_changed: ${{ steps.split.outputs.nomad_sentinel_changed }}
    steps:
      - name: Split nomad-sentinel Out Of The Filtered Matrix
        id: split
        run: |
          MATRIX='${{ needs.get-matrix.outputs.matrix }}'
          OTHER=$(echo "$MATRIX" | jq -c '{items: (.items | map(select(.name != "nomad-sentinel")))}')
          NS_PRESENT=$(echo "$MATRIX" | jq -r '(.items | map(select(.name == "nomad-sentinel")) | length) > 0')
          echo "other_tools=$OTHER" >> "$GITHUB_OUTPUT"
          echo "nomad_sentinel_changed=$NS_PRESENT" >> "$GITHUB_OUTPUT"

  test-nomad-sentinel:
    needs: split-nomad-sentinel
    if: needs.split-nomad-sentinel.outputs.nomad_sentinel_changed == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Install Nomad
        run: |
          NOMAD_VERSION="1.11.0"
          curl -fsSL "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" -o nomad.zip
          unzip -o nomad.zip -d /tmp/nomad-bin
          echo "/tmp/nomad-bin" >> "$GITHUB_PATH"

      - name: Start Nomad In Dev Mode
        run: |
          nohup nomad agent -dev > nomad-dev.log 2>&1 &
          echo "NOMAD_ADDR=http://127.0.0.1:4646" >> "$GITHUB_ENV"
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:4646/v1/status/leader > /dev/null && break
            sleep 1
          done

      - name: Collect Nomad Fixture Data
        run: |
          ./scripts/collect-nomad-data.sh "${NOMAD_ADDR}" --stdout > monitoring/nomad-sentinel/tests/fixtures/nomad-dev-data.json

      - name: Fetch Test Credentials From Vault
        uses: ./.github/actions/vault-secrets
        with:
          vault-url: ${{ vars.VAULT_ADDRESS }}
          vault-jwt-path: ${{ vars.VAULT_JWT_PATH }}
          vault-role: ${{ vars.VAULT_CI_ROLE }}
          secrets: |
            kv/data/cicd/nomad-sentinel gemini_api_key | GEMINI_API_KEY ;
            kv/data/cicd/slack webhook_url | SLACK_WEBHOOK_URL

      - name: Run Tests
        working-directory: monitoring/nomad-sentinel
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          NOMAD_ADDR: ${{ env.NOMAD_ADDR }}
        run: |
          pip install -r requirements.txt --break-system-packages
          pytest tests/ -v

  build:
    needs: split-nomad-sentinel
    if: fromJson(needs.split-nomad-sentinel.outputs.other_tools).items[0] != null
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.split-nomad-sentinel.outputs.other_tools) }}

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Fetch Deployment Secrets From Vault
        if: matrix.items.name != 'grafana'
        uses: ./.github/actions/vault-secrets
        with:
          vault-url: ${{ vars.VAULT_ADDRESS }}
          vault-jwt-path: ${{ vars.VAULT_JWT_PATH }}
          vault-role: ${{ vars.VAULT_CI_ROLE }}
          secrets: |
            kv/data/cicd/octopus service_account_id | OCTOPUS_SERVICE_ACCOUNT_ID ;
            kv/data/cicd/octopus space | OCTOPUS_SPACE ;
            kv/data/cicd/slack webhook_url | SLACK_WEBHOOK_URL

      - name: Fetch Slack Webhook Only (grafana build report - not deployed via octopus)
        if: matrix.items.name == 'grafana'
        uses: ./.github/actions/vault-secrets
        with:
          vault-url: ${{ vars.VAULT_ADDRESS }}
          vault-jwt-path: ${{ vars.VAULT_JWT_PATH }}
          vault-role: ${{ vars.VAULT_CI_ROLE }}
          secrets: |
            kv/data/cicd/slack webhook_url | SLACK_WEBHOOK_URL

      - name: Set short SHA and Build ID
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Set Up Docker Buildx
        uses: ./.github/actions/docker-buildx-setup
        with:
          registry-host: ${{ env.REGISTRY_HOST }}

      - name: Build Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: "${{ matrix.items.path }}"
          push: false
          load: true
          tags: "${{ env.IMAGE_REGISTRY_PATH }}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: "${{ env.IMAGE_REGISTRY_PATH }}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          results-name: "${{ matrix.items.name }}"

      - name: Push Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: "${{ matrix.items.path }}"
          push: true
          tags: "${{ env.IMAGE_REGISTRY_PATH }}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cosign Sign, Attest, And Verify
        id: cosign
        uses: ./.github/actions/cosign-sign-attest
        with:
          image-repo: "${{ env.IMAGE_REGISTRY_PATH }}/${{ matrix.items.name }}"
          image-tag: "${{ env.SHORT_SHA }}"
          trivy-results-file: "${{ matrix.items.name }}-trivy-results.json"

      - name: Save build metadata
        run: |
          mkdir -p /tmp/build-metadata
          cat > /tmp/build-metadata/${{ matrix.items.name }}-metadata.json << EOF
          {
            "service": "${{ matrix.items.name }}",
            "image_repo": "${{ env.IMAGE_REGISTRY_PATH }}/${{ matrix.items.name }}",
            "image_tag": "${{ env.SHORT_SHA }}",
            "image_digest": "${{ steps.cosign.outputs.image-digest }}",
            "scan_report": "gs://${{ env.CICD_BUCKET }}/security-scans/trivy/${{ env.RUN_ID }}/${{ env.SHORT_SHA }}/${{ matrix.items.name }}-trivy-results.json"
          }
          EOF

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.items.name }}-build-metadata
          path: /tmp/build-metadata/${{ matrix.items.name }}-metadata.json

      - name: Package And Release To Octopus
        if: matrix.items.name != 'grafana'
        uses: ./.github/actions/octopus-release
        with:
          octopus-server: ${{ vars.OCTOPUS_DEPLOY_SERVER }}
          octopus-service-account-id: ${{ env.OCTOPUS_SERVICE_ACCOUNT_ID }}
          octopus-project: "${{ matrix.items.octopus_project }}"
          package-version: "${{ matrix.items.name }}-${{ env.SHORT_SHA }}"
          release-number: "${{ env.SHORT_SHA }}"
          job-spec-path: "${{ matrix.items.job_spec }}"

      - name: Send Slack notification on build failure
        if: failure()
        uses: ./.github/actions/slack-notify-failure
        with:
          webhook-url: ${{ env.SLACK_WEBHOOK_URL }}
          item-label: "Tool"
          item-name: "${{ matrix.items.name }}"
          sha: "${{ env.SHORT_SHA }}"

  build-nomad-sentinel:
    needs: [split-nomad-sentinel, test-nomad-sentinel]
    if: |
      needs.split-nomad-sentinel.outputs.nomad_sentinel_changed == 'true' &&
      needs.test-nomad-sentinel.result == 'success'
    runs-on: [self-hosted, linux, x64]
    env:
      TOOL_NAME: nomad-sentinel
      TOOL_PATH: monitoring/nomad-sentinel
      JOB_SPEC: nomad-jobs/monitoring/nomad-sentinel.nomad.hcl
      TOOL_OCTOPUS_PROJECT: monitoring
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Fetch Deployment Secrets From Vault
        uses: ./.github/actions/vault-secrets
        with:
          vault-url: ${{ vars.VAULT_ADDRESS }}
          vault-jwt-path: ${{ vars.VAULT_JWT_PATH }}
          vault-role: ${{ vars.VAULT_CI_ROLE }}
          secrets: |
            kv/data/cicd/octopus service_account_id | OCTOPUS_SERVICE_ACCOUNT_ID ;
            kv/data/cicd/octopus space | OCTOPUS_SPACE ;
            kv/data/cicd/slack webhook_url | SLACK_WEBHOOK_URL

      - name: Set short SHA and Build ID
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Set Up Docker Buildx
        uses: ./.github/actions/docker-buildx-setup
        with:
          registry-host: ${{ env.REGISTRY_HOST }}

      - name: Build Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: "${{ env.TOOL_PATH }}"
          push: false
          load: true
          tags: "${{ env.IMAGE_REGISTRY_PATH }}/${{ env.TOOL_NAME }}:${{ env.SHORT_SHA }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: "${{ env.IMAGE_REGISTRY_PATH }}/${{ env.TOOL_NAME }}:${{ env.SHORT_SHA }}"
          results-name: "${{ env.TOOL_NAME }}"

      - name: Push Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: "${{ env.TOOL_PATH }}"
          push: true
          tags: "${{ env.IMAGE_REGISTRY_PATH }}/${{ env.TOOL_NAME }}:${{ env.SHORT_SHA }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cosign Sign, Attest, And Verify
        id: cosign
        uses: ./.github/actions/cosign-sign-attest
        with:
          image-repo: "${{ env.IMAGE_REGISTRY_PATH }}/${{ env.TOOL_NAME }}"
          image-tag: "${{ env.SHORT_SHA }}"
          trivy-results-file: "${{ env.TOOL_NAME }}-trivy-results.json"

      - name: Save build metadata
        run: |
          mkdir -p /tmp/build-metadata
          cat > /tmp/build-metadata/${{ env.TOOL_NAME }}-metadata.json << EOF
          {
            "service": "${{ env.TOOL_NAME }}",
            "image_repo": "${{ env.IMAGE_REGISTRY_PATH }}/${{ env.TOOL_NAME }}",
            "image_tag": "${{ env.SHORT_SHA }}",
            "image_digest": "${{ steps.cosign.outputs.image-digest }}",
            "scan_report": "gs://${{ env.CICD_BUCKET }}/security-scans/trivy/${{ env.RUN_ID }}/${{ env.SHORT_SHA }}/${{ env.TOOL_NAME }}-trivy-results.json"
          }
          EOF

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ env.TOOL_NAME }}-build-metadata
          path: /tmp/build-metadata/${{ env.TOOL_NAME }}-metadata.json

      - name: Package And Release To Octopus
        uses: ./.github/actions/octopus-release
        with:
          octopus-server: ${{ vars.OCTOPUS_DEPLOY_SERVER }}
          octopus-service-account-id: ${{ env.OCTOPUS_SERVICE_ACCOUNT_ID }}
          octopus-project: "${{ env.TOOL_OCTOPUS_PROJECT }}"
          package-version: "${{ env.TOOL_NAME }}-${{ env.SHORT_SHA }}"
          release-number: "${{ env.SHORT_SHA }}"
          job-spec-path: "${{ env.JOB_SPEC }}"

      - name: Send Slack notification on build failure
        if: failure()
        uses: ./.github/actions/slack-notify-failure
        with:
          webhook-url: ${{ env.SLACK_WEBHOOK_URL }}
          item-label: "Tool"
          item-name: "nomad-sentinel"
          sha: "${{ env.SHORT_SHA }}"

  publish-build-manifest:
    needs: [build, build-nomad-sentinel]
    if: |
      always() &&
      (contains(fromJson('["success", "failure"]'), needs.build.result) ||
       contains(fromJson('["success", "failure"]'), needs.build-nomad-sentinel.result))
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Set short SHA and Build ID
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Publish Build Manifest
        uses: ./.github/actions/publish-build-manifest
        with:
          cicd-bucket: ${{ vars.CICD_ARTIFACT_BUCKET }}
          short-sha: ${{ env.SHORT_SHA }}
          run-id: ${{ env.RUN_ID }}
