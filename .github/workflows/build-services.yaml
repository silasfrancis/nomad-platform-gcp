name: build-services

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "nomad-jobs/boutique/**"

permissions:
  id-token: write
  contents: read

env:
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
  CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}

jobs:
  get-matrix:
    uses: ./.github/workflows/detect-changes.yaml
    with:
      config-file: ".github/configs/boutique-services.json"

  build:
    needs: get-matrix
    if: fromJson(needs.get-matrix.outputs.matrix).items[0] != null
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22

      - name: Verify Cosign install
        run: cosign version

      - name: Fetch Deployment Secrets From Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
        with:
          url: ${{ vars.VAULT_ADDRESS }}
          method: jwt
          path: ${{ vars.VAULT_JWT_PATH }}
          role: ${{ vars.VAULT_CI_ROLE }}
          secrets: |
            kv/data/cicd/octopus service_account_id | OCTOPUS_SERVICE_ACCOUNT_ID ;
            kv/data/cicd/octopus space | OCTOPUS_SPACE ;
            kv/data/cicd/slack webhook_url | SLACK_WEBHOOK_URL

      - name: Set short SHA and Build ID
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Build Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: "${{ matrix.items.path }}"
          file: "Dockerfile"
          push: false
          load: true
          tags: "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          format: "json"
          output: "${{ matrix.items.name }}-trivy-results.json"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          trivyignores: .trivyignore
          cache: true

      - name: Display Trivy vulnerabilities
        if: failure() && steps.trivy-scan.outcome == 'failure'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          trivyignores: .trivyignore
          cache: true

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: "${{ matrix.items.name }}-trivy-results"
          path: "${{ matrix.items.name }}-trivy-results.json"

      - name: Push Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: "${{ matrix.items.path }}"
          file: "Dockerfile"
          push: true
          tags: "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: get_digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe \
            "${{ env.ARTIFACT_REGISTRY }}/${{ matrix.items.name }}:${{ env.SHORT_SHA }}" \
            --format='value(image_summary.digest)')

          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image with Cosign
        run: cosign sign --yes "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}@${{ steps.get_digest.outputs.IMAGE_DIGEST }}"

      - name: Verify Image Signature
        run: |
          for i in 1 2 3 4 5; do
            if cosign verify "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}@${{ steps.get_digest.outputs.IMAGE_DIGEST }}" \
              --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "All verification attempts failed"
          exit 1

      - name: Attest scan results with Cosign
        run: |
          cosign attest --yes \
          --predicate '${{ matrix.items.name }}-trivy-results.json' \
          --type vuln \
          "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}@${{ steps.get_digest.outputs.IMAGE_DIGEST }}"

      - name: Verify scan attestation
        run: |
          for i in 1 2 3 4 5; do
            if cosign verify-attestation "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}@${{ steps.get_digest.outputs.IMAGE_DIGEST }}" \
              --type vuln \
              --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "All verification attempts failed"
          exit 1

      - name: Save build metadata
        run: |
          mkdir -p /tmp/build-metadata
          cat > /tmp/build-metadata/${{ matrix.items.name }}-metadata.json << EOF
          {
            "service": "${{ matrix.items.name }}",
            "image_repo": "${ARTIFACT_REGISTRY}/${{ matrix.items.name }}",
            "image_tag": "${{ env.SHORT_SHA }}",
            "image_digest": "${{ steps.get_digest.outputs.IMAGE_DIGEST }}",
            "scan_report": "gs://${{ env.CICD_BUCKET }}/security-scans/trivy/${{ env.RUN_ID }}/${{ env.SHORT_SHA }}/${{ matrix.items.name }}-trivy-results.json"
          }
          EOF

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.items.name }}-build-metadata
          path: /tmp/build-metadata/${{ matrix.items.name }}-metadata.json

      - name: Package Job Spec + Deployment Scripts
        run: |
          mkdir -p release-package/scripts
          cp octopus/deployment-scripts/*.sh release-package/scripts/
          cp "${{ matrix.items.job_spec }}" release-package/

      # - name: Login To Octopus
      #   uses: OctopusDeploy/login@e39e03d07630f363bdccd6c7ad4eb28e0ea8a184
      #   with:
      #     server: ${{ vars.OCTOPUS_DEPLOY_SERVER }}
      #     service_account_id: ${{ env.OCTOPUS_SERVICE_ACCOUNT_ID }}
      #     # If service-account OIDC login isn't actually available on
      #     # this self-hosted Octopus version, swap the line above for:
      #     #   api_key: ${{ env.OCTOPUS_API_KEY }}
      #     # and add an api_key field alongside url/service_account_id/
      #     # space at kv/data/cicd/octopus.

      # - name: Create Zip Package
      #   id: zip
      #   uses: OctopusDeploy/create-zip-package-action@18a23ace1d3d51bc21429a1628e50acc36080400
      #   with:
      #     package_id: "${{ matrix.items.octopus_project }}"
      #     version: "${{ matrix.items.name }}-${{ env.SHORT_SHA }}"
      #     base_path: release-package
      #     output_folder: packaged
      #     files: |
      #       **/*

      # - name: Push Package To Octopus
      #   uses: OctopusDeploy/push-package-action@39ed2af62de5aeb10692eb62cae1e3a333f0c2f5
      #   with:
      #     packages: "${{ steps.zip.outputs.package_file_path }}"

      # - name: Create Octopus Release
      #   uses: OctopusDeploy/create-release-action@4bd7d595da7f803e467d41c32fa0b5dbb9f222dc
      #   with:
      #     project: "${{ matrix.items.octopus_project }}"
      #     release_number: "${{ env.SHORT_SHA }}" # Release number is used as an octopus deploy variable in nomad job templates (#{ImageTag})
      #     packages: "${{ matrix.items.octopus_project }}:${{ matrix.items.name }}-${{ env.SHORT_SHA }}"
      #   # No deploy step: Dev's lifecycle phase has
      #   # automatic_deployment_targets = [dev], so release creation alone
      #   # triggers an automatic deploy to Dev. Production is manual
      #   # approval in the Octopus UI only — CI stops at release creation.

      - name: Send Slack notification on build failure
        if: failure()
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95
        with:
          payload: |
            {
              "text": "❌ *${{ github.workflow }}* — `${{ matrix.items.name }}` failed on `${{ github.ref_name }}`",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {
                    "title": "Service",
                    "value": "${{ matrix.items.name }}",
                    "short": true
                  },
                  {
                    "title": "SHA",
                    "value": "${{ env.SHORT_SHA }}",
                    "short": true
                  },
                  {
                    "title": "Actor",
                    "value": "${{ github.actor }}",
                    "short": true
                  },
                  {
                    "title": "Run",
                    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }]
            }
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

  publish-build-manifest:
    needs: build
    if: ${{ contains(fromJson('["success", "failure"]'), needs.build.result) }}
    runs-on: [self-hosted, linux, x64]
    env:
      CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
    steps:
      - name: Set short SHA and Build ID
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Download trivy scan artifacts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "*-trivy-results"
          path: /tmp/trivy-scan
          merge-multiple: true
        continue-on-error: true

      - name: Download build metadata artifacts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "*-build-metadata"
          path: /tmp/build-metadata
          merge-multiple: true
        continue-on-error: true

      - name: Combine build metadata into single manifest
        if: always()
        run: |
          if ls /tmp/build-metadata/*.json 1>/dev/null 2>&1; then
            IMAGE_DETAILS=$(ls /tmp/build-metadata/*.json | xargs jq -s '.')
          else
            IMAGE_DETAILS="[]"
          fi
          cat > build-manifest.json << EOF
          {
            "build_id": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}",
            "image_details": $IMAGE_DETAILS
          }
          EOF
          cat build-manifest.json

      - name: Push trivy scan results to GCS
        if: always()
        run: |
          if [ -d /tmp/trivy_scan ] && [ "$(ls -A /tmp/trivy_scan)" ]; then
            gsutil -m cp -z json -h "Content-Type:application/json" \
              /tmp/trivy_scan/* "gs://${{ env.CICD_BUCKET }}/security-scans/trivy/${{ env.RUN_ID }}/${{ env.SHORT_SHA }}/"
          else
            echo "No trivy scan results to upload"
          fi

      - name: Publish build manifest to GCS
        if: always()
        run: |
          gsutil cp build-manifest.json \
            "gs://${{ env.CICD_BUCKET }}/manifests/${{ env.RUN_ID }}/${{ env.SHORT_SHA }}/build-manifest.json"
