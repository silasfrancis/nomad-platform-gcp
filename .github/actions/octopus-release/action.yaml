name: "Package And Release To Octopus Deploy"
description: "Packages the job spec + deployment scripts, pushes to Octopus, and creates a release (no deploy step - Dev auto-deploys on release creation, Prod is manual-approval in the Octopus UI)"

inputs:
  octopus-server:
    required: true
  octopus-service-account-id:
    required: true
  octopus-project:
    description: "Octopus project / package_id, e.g. matrix.items.octopus_project"
    required: true
  package-version:
    description: "Package version, e.g. <name>-<short_sha>"
    required: true
  release-number:
    description: "Octopus release number, used as #{ImageTag} in Nomad job templates"
    required: true
  job-spec-path:
    description: "Path to the .nomad.hcl job spec to package"
    required: true

runs:
  using: composite
  steps:
    - name: Package Job Spec + Deployment Scripts
      shell: bash
      run: |
        mkdir -p release-package/scripts
        cp octopus/deployment-scripts/*.sh release-package/scripts/
        cp "${{ inputs.job-spec-path }}" release-package/

    - name: Login To Octopus
      uses: OctopusDeploy/login@e39e03d07630f363bdccd6c7ad4eb28e0ea8a184
      with:
        server: ${{ inputs.octopus-server }}
        service_account_id: ${{ inputs.octopus-service-account-id }}

    - name: Create Zip Package
      id: zip
      uses: OctopusDeploy/create-zip-package-action@18a23ace1d3d51bc21429a1628e50acc36080400
      with:
        package_id: "${{ inputs.octopus-project }}"
        version: "${{ inputs.package-version }}"
        base_path: release-package
        output_folder: packaged
        files: |
          **/*

    - name: Push Package To Octopus
      uses: OctopusDeploy/push-package-action@39ed2af62de5aeb10692eb62cae1e3a333f0c2f5
      with:
        packages: "${{ steps.zip.outputs.package_file_path }}"

    - name: Create Octopus Release
      uses: OctopusDeploy/create-release-action@4bd7d595da7f803e467d41c32fa0b5dbb9f222dc
      with:
        project: "${{ inputs.octopus-project }}"
        release_number: "${{ inputs.release-number }}"
        packages: "${{ inputs.octopus-project }}:${{ inputs.package-version }}"

    # No deploy step: Dev's lifecycle phase has
    # automatic_deployment_targets = [dev], so release creation alone
    # triggers an automatic deploy to Dev. Production is manual
    # approval in the Octopus UI only - CI stops at release creation.
