name: "Docker Buildx Setup"
description: "Authenticates Docker against Artifact Registry and sets up a docker-container buildx builder (required for GHA cache export)"

inputs:
  registry-host:
    description: "Artifact Registry host, e.g. europe-west1-docker.pkg.dev"
    required: true

runs:
  using: composite
  steps:
    - name: Configure Docker Auth for Artifact Registry
      shell: bash
      run: |
        gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ inputs.registry-host }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
