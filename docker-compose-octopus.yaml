
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssqloctopus
    restart: unless-stopped
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
    ports:
      - 1433:1433
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "${MSSQL_SA_PASSWORD}",
          "-No",
          "-Q",
          "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - sqlvolume:/var/opt/mssql

  octopus-server:
    image: octopusdeploy/octopusdeploy@sha256:42c3bf19342e6662bbfc5bb8c40470a0925ee97e6686ed8507ce58b0667fdf7d
    container_name: octopusdeploy
    restart: unless-stopped
    privileged: ${PRIVILEGED}
    # user: ${USER}
    environment:
      ACCEPT_EULA: ${ACCEPT_OCTOPUS_EULA}
      OCTOPUS_SERVER_NODE_NAME: ${OCTOPUS_SERVER_NODE_NAME}
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      MASTER_KEY: ${MASTER_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DISABLE_DIND: ${DISABLE_DIND}
    ports:
      - 8080:8080
      - 11111:10943
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - octopus-repository:/repository
      - octopus-artifacts:/artifacts
      - octopus-tasklogs:/taskLogs
      - octopus-cache:/cache
      - octopus-import:/import
      - octopus-eventexports:/eventExports

volumes:
  octopus-repository:
  octopus-artifacts:
  octopus-tasklogs:
  octopus-cache:
  octopus-import:
  octopus-eventexports:
  sqlvolume: