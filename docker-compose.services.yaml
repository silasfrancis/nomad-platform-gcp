# Docker Compose — Online Boutique Application Services (Local Development Only)
services:
  redis-cart:
    image: redis:alpine
    container_name: redis-cart
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - boutique-net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    image: local/frontend:dev
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"
      ENABLE_PROFILER: "0"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    networks:
      - boutique-net

  currencyservice:
    build:
      context: ./services/currencyservice
      dockerfile: Dockerfile
    image: local/currencyservice:dev
    container_name: currencyservice
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    expose:
      - "7000"
    networks:
      - boutique-net

  productcatalogservice:
    build:
      context: ./services/productcatalogservice
      dockerfile: Dockerfile
    image: local/productcatalogservice:dev
    container_name: productcatalogservice
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    expose:
      - "3550"
    networks:
      - boutique-net

  checkoutservice:
    build:
      context: ./services/checkoutservice
      dockerfile: Dockerfile
    image: local/checkoutservice:dev
    container_name: checkoutservice
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:5000"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
    expose:
      - "5050"
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    networks:
      - boutique-net

  shippingservice:
    build:
      context: ./services/shippingservice
      dockerfile: Dockerfile
    image: local/shippingservice:dev
    container_name: shippingservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    expose:
      - "50051"
    networks:
      - boutique-net

  cartservice:
    build:
      context: ./services/cartservice/src
      dockerfile: Dockerfile
    image: local/cartservice:dev
    container_name: cartservice
    environment:
      REDIS_ADDR: "redis-cart:6379,password=${REDIS_PASSWORD}"
    expose:
      - "7070"
    depends_on:
      redis-cart:
        condition: service_healthy
    networks:
      - boutique-net

  emailservice:
    build:
      context: ./services/emailservice
      dockerfile: Dockerfile
    image: local/emailservice:dev
    container_name: emailservice
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    expose:
      - "8080"
    networks:
      - boutique-net

  paymentservice:
    build:
      context: ./services/paymentservice
      dockerfile: Dockerfile
    image: local/paymentservice:dev
    container_name: paymentservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    expose:
      - "50051"
    networks:
      - boutique-net

  recommendationservice:
    build:
      context: ./services/recommendationservice
      dockerfile: Dockerfile
    image: local/recommendationservice:dev
    container_name: recommendationservice
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      DISABLE_PROFILER: "1"
    expose:
      - "8080"
    depends_on:
      - productcatalogservice
    networks:
      - boutique-net

  adservice:
    build:
      context: ./services/adservice
      dockerfile: Dockerfile
    image: local/adservice:dev
    container_name: adservice
    environment:
      PORT: "9555"
    expose:
      - "9555"
    networks:
      - boutique-net


  loadgenerator-init:
    image: busybox:latest
    container_name: loadgenerator-init
    environment:
      FRONTEND_ADDR: "frontend:8080"
    command:
      - /bin/sh
      - -exc
      - |
        MAX_RETRIES=12
        RETRY_INTERVAL=10
        for i in $$(seq 1 $$MAX_RETRIES); do
          echo "Attempt $$i: Pinging frontend: $${FRONTEND_ADDR}..."
          STATUSCODE=$$(wget --server-response http://$${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $$2}')
          if [ "$$STATUSCODE" = "200" ]; then
              echo "Frontend is reachable."
              exit 0
          fi
          echo "Error: Could not reach frontend - Status code: $${STATUSCODE}"
          sleep $$RETRY_INTERVAL
        done
        echo "Failed to reach frontend after $$MAX_RETRIES attempts."
        exit 1
    depends_on:
      - frontend
    networks:
      - boutique-net

  loadgenerator:
    build:
      context: ./services/loadgenerator
      dockerfile: Dockerfile
    image: local/loadgenerator:dev
    container_name: loadgenerator
    environment:
      FRONTEND_ADDR: "frontend:8080"
      USERS: "10"
      RATE: "1"
    depends_on:
      loadgenerator-init:
        condition: service_completed_successfully
    networks:
      - boutique-net
    restart: "no"

networks:
  boutique-net:
    driver: bridge

volumes:
  redis-data:
