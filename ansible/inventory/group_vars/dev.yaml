---
# Applies Automatically To Any Host Labeled env=dev In GCP (See
# inventory/gcp.yaml's keyed_groups). Does NOT Apply To mgmt-vm, Which Has
# No env Label Since It Serves Both Environments.

environment_name: dev
vault_jwt_auth_backend_path: "jwt-nomad-dev"

bootstrap_expect: 1

# Nomad/Consul Server discovery configs are passed in at runtime via startup scripts
retry_join: ""

traefik_active_instances:
  - dev-public