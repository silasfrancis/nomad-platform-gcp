---
# IAP Tunnel — %h Resolves To ansible_host, Which inventory/gcp.yaml Sets
# To The GCE Instance Name (Not An IP), Which Is What
# `gcloud compute start-iap-tunnel` Expects.
ansible_user: "silasfrancis57_gmail_com"
ansible_ssh_common_args: >-
  -o ProxyCommand="gcloud compute start-iap-tunnel %h %p
  --listen-on-stdin --zone={{ gce_zone }} --project={{ gcp_project_id }}"

ansible_ssh_private_key_file: "~/.ssh/google_compute_engine"

gcp_project_id: "nomad-platform-gcp"

# Secret Manager Secret IDs — Must Already Exist (Created By
# terraform/bootstrap's secret-manager Module, default_secrets). These
# Playbooks/Roles Only Ever Write New Versions Into Secrets That Already
# Exist; They Never Create The Secret Container Itself.
secret_vault_root_token: "vault-root-token"
secret_vault_recovery_keys: "vault-recovery-keys"
secret_octopus_sql_admin_password: "octopus-mssql-admin-password"
secret_octopus_admin_password: "octopus-admin-password"
secret_octopus_master_key: "octopus-master-key"
secret_octopus_admin_api_key: "octopus-admin-api-key"
secret_github_bot_pat: "github-nomad-repo-pat"
