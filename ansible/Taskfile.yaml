version: '3'
vars:
  PLAYBOOK_DIR: playbooks

tasks:

  check-env:
    desc: "Internal — confirms GCP_PROJECT_ID is set before anything else runs"
    internal: true
    silent: true
    cmds:
      - |
        if [ -z "$GCP_PROJECT_ID" ]; then
          echo "GCP_PROJECT_ID is not set. Run: export GCP_PROJECT_ID=<project-id>"
          exit 1
        fi

  check-target-env:
    desc: "Internal — confirms ENV=dev or ENV=prod was passed to a task that requires it"
    internal: true
    silent: true
    cmds:
      - |
        if [ "{{.ENV}}" != "dev" ] && [ "{{.ENV}}" != "prod" ]; then
          echo "ENV must be 'dev' or 'prod' — pass it like: task {{.TARGET_TASK_NAME}} ENV=dev"
          exit 1
        fi

  install:
    desc: "Step 0 — install required Ansible collections + control-node Python deps"
    cmds:
      - ansible-galaxy collection install -r requirements.yaml
      - pip install requests google-auth --break-system-packages

  inventory-check:
    desc: "Step 0.5 — confirms the dynamic inventory actually resolves hosts into every group the playbooks expect"
    deps: [check-env]
    cmds:
      - ansible-inventory --graph

  connectivity-check:
    desc: "Step 0.6 — confirms Ansible can actually reach every inventory host over SSH (via IAP)"
    deps: [inventory-check]
    cmds:
      - ansible -i inventory/gcp.yaml all -m ping

  pki-reminder:
    desc: "Step 1 — REMINDER ONLY, not runnable from here: scripts/generate-and-push-pki.sh (outside this ansible/ directory) must have been run at least once before anything below — every role fetches its TLS material directly from Secret Manager and has nothing to fall back to if it doesn't exist yet"
    silent: true
    cmds:
      - echo "Confirm scripts/generate-and-push-pki.sh has been run at least once before continuing."

  mgmt:
    desc: "Step 2 — configure mgmt-vm: Vault, Octopus, the GitHub runner, Docker data disk + prune timer"
    deps: [check-env]
    cmds:
      - ansible-playbook {{.PLAYBOOK_DIR}}/mgmt.yaml -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  vault-init:
    desc: "Step 3 — ONE-TIME Vault operator init. Run only after 'mgmt' has succeeded at least once. Safe to re-run (guards on Vault's own initialized status)."
    deps: [check-env]
    cmds:
      - ansible-playbook {{.PLAYBOOK_DIR}}/vault-init.yaml -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  nomad-servers:
    desc: "Step 4 — configure Nomad + Consul server nodes for ONE environment (ENV=dev or ENV=prod required, e.g. task nomad-servers ENV=dev)"
    deps: [check-env]
    cmds:
      - task: check-target-env
        vars: { TARGET_TASK_NAME: nomad-servers, ENV: '{{.ENV}}' }
      - ansible-playbook {{.PLAYBOOK_DIR}}/nomad-servers.yaml --limit {{.ENV}} -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  consul-acl-bootstrap:
    desc: "Step 5 — bootstrap Consul ACLs for ONE environment, ONCE (ENV=dev or ENV=prod required). Must run before terraform/platform-config."
    deps: [check-env]
    cmds:
      - task: check-target-env
        vars: { TARGET_TASK_NAME: consul-acl-bootstrap, ENV: '{{.ENV}}' }
      - ansible-playbook {{.PLAYBOOK_DIR}}/consul-acl-bootstrap.yaml --limit {{.ENV}} -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  nomad-acl-bootstrap:
    desc: "Step 6 — bootstrap Nomad ACLs for ONE environment, ONCE (ENV=dev or ENV=prod required). Must run before terraform/platform-config."
    deps: [check-env]
    cmds:
      - task: check-target-env
        vars: { TARGET_TASK_NAME: nomad-acl-bootstrap, ENV: '{{.ENV}}' }
      - ansible-playbook {{.PLAYBOOK_DIR}}/nomad-acl-bootstrap.yaml --limit {{.ENV}} -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  nomad-clients:
    desc: "Step 7 — reconfigure LIVE Nomad client nodes directly (not the Packer MIG image bake — see nomad-clients.yaml's own header comment for that separate path)"
    deps: [check-env]
    cmds:
      - ansible-playbook {{.PLAYBOOK_DIR}}/nomad-clients.yaml -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  traefik-internal:
    desc: "Step 8 — configure traefik-internal (mgmt/dev-internal/prod-internal instances, one pass)"
    deps: [check-env]
    cmds:
      - ansible-playbook {{.PLAYBOOK_DIR}}/traefik-internal.yaml -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  traefik-public:
    desc: "Step 9 — configure public Traefik for ONE environment (ENV=dev or ENV=prod required)"
    deps: [check-env]
    cmds:
      - task: check-target-env
        vars: { TARGET_TASK_NAME: traefik-public, ENV: '{{.ENV}}' }
      - ansible-playbook {{.PLAYBOOK_DIR}}/traefik-public.yaml --limit {{.ENV}} -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  grafana:
    desc: "Step 10 — configure Grafana on mgmt-vm"
    deps: [check-env]
    cmds:
      - ansible-playbook {{.PLAYBOOK_DIR}}/grafana.yaml -e gcp_project_id=$GCP_PROJECT_ID {{.CLI_ARGS}}

  mgmt-vm:
    desc: "Configure the complete management layer: mgmt-vm, Vault initialization, and Grafana"
    deps: [check-env]
    cmds:
      - task: mgmt
      - task: vault-init
      - task: grafana

  traefik:
    desc: "Configure the complete Traefik layer: internal Traefik plus public Traefik for dev and prod"
    deps: [check-env]
    cmds:
      - task: traefik-internal
      - task: traefik-public
        vars:
          ENV: '{{.ENV}}'

  nomad-consul:
    desc: "Configure the complete Nomad + Consul layer for dev and prod"
    deps: [check-env]
    cmds:
      - task: nomad-servers
        vars:
          ENV: '{{.ENV}}'
      - task: nomad-clients
      - task: consul-acl-bootstrap
        vars:
          ENV: '{{.ENV}}'
      - task: nomad-acl-bootstrap
        vars:
          ENV: '{{.ENV}}'