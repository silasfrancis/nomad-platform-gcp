---
# NOTE: Environments, Projects, And Deployment Targets Are Created By The
# Terraform service-config Layer (Via Octopus's REST API/Provider), Not
# By This Role — This Role Only Gets Both Containers Running And
# Reachable. Requires The docker Role To Have Already Run (mgmt.yml's
# Role Ordering Handles This).

# --- Sql-Data Disk (Backs Both mssql's Data And Octopus's Own Volumes) ---
- name: Check If Sql-Data Disk Is Already Formatted
  ansible.builtin.command: blkid /dev/disk/by-id/google-sql-data
  register: sql_disk_blkid
  failed_when: false
  changed_when: false

- name: Format Sql-Data Disk (Only If Unformatted)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/disk/by-id/google-sql-data
  when: sql_disk_blkid.rc != 0

- name: Ensure Octopus Data Mount Point Exists
  ansible.builtin.file:
    path: "{{ octopus_data_dir }}"
    state: directory
    mode: "0777"

- name: Mount Sql-Data Disk
  ansible.posix.mount:
    path: "{{ octopus_data_dir }}"
    src: /dev/disk/by-id/google-sql-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Create Octopus/Mssql Data Subdirectories
  ansible.builtin.file:
    path: "{{ octopus_data_dir }}/{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - mssql
    - repository
    - artifacts
    - taskLogs
    - cache
    - import
    - eventExports

# --- Secrets: SA Password, Master Key, Admin Password, Admin API Key ---
# Each Follows The Same Pattern: Read Existing From Secret Manager First,
# Only Generate + Write Back If None Exists Yet. Regenerating Any Of These
# On A Second Run Would Desync From The Already-Initialized Database.

- name: Attempt To Read Existing SA Password From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret={{ secret_octopus_sql_admin_password }} --project={{ gcp_project_id }}
  register: sql_password_existing
  no_log: true
  changed_when: false
  failed_when: false

- name: Generate New SA Password (Only If None Exists Yet)
  ansible.builtin.command: openssl rand -base64 24
  register: sql_password_generated
  no_log: true
  changed_when: false
  when: sql_password_existing.rc != 0

- name: Set SA Password Fact
  ansible.builtin.set_fact:
    mssql_sa_password: >-
      {{ sql_password_generated.stdout | default('') if sql_password_existing.rc != 0
         else sql_password_existing.stdout }}
  no_log: true

- name: Write New SA Password To Secret Manager (Only If Freshly Generated)
  ansible.builtin.shell: >
    echo -n "{{ mssql_sa_password }}" |
    gcloud secrets versions add {{ secret_octopus_sql_admin_password }}
    --data-file=- --project={{ gcp_project_id }}
  when: sql_password_existing.rc != 0
  no_log: true
  changed_when: true

- name: Attempt To Read Existing Octopus Master Key From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret={{ secret_octopus_master_key }} --project={{ gcp_project_id }}
  register: octopus_master_key_existing
  no_log: true
  changed_when: false
  failed_when: false

- name: Generate New Octopus Master Key (Only If None Exists Yet)
  # Per Octopus's Own Docs: "Create A New Master Key With The Command:
  # openssl rand 16 | base64"
  ansible.builtin.shell: openssl rand 16 | base64
  register: octopus_master_key_generated
  no_log: true
  changed_when: false
  when: octopus_master_key_existing.rc != 0

- name: Set Octopus Master Key Fact
  ansible.builtin.set_fact:
    octopus_master_key: >-
      {{ octopus_master_key_generated.stdout | default('') if octopus_master_key_existing.rc != 0
         else octopus_master_key_existing.stdout }}
  no_log: true

- name: Write New Octopus Master Key To Secret Manager (Only If Freshly Generated)
  ansible.builtin.shell: >
    echo -n "{{ octopus_master_key }}" |
    gcloud secrets versions add {{ secret_octopus_master_key }}
    --data-file=- --project={{ gcp_project_id }}
  when: octopus_master_key_existing.rc != 0
  no_log: true
  changed_when: true

- name: Attempt To Read Existing Octopus Admin Password From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret={{ secret_octopus_admin_password }} --project={{ gcp_project_id }}
  register: octopus_admin_password_existing
  no_log: true
  changed_when: false
  failed_when: false

- name: Generate New Octopus Admin Password (Only If None Exists Yet)
  ansible.builtin.command: openssl rand -base64 24
  register: octopus_admin_password_generated
  no_log: true
  changed_when: false
  when: octopus_admin_password_existing.rc != 0

- name: Set Octopus Admin Password Fact
  ansible.builtin.set_fact:
    octopus_admin_password: >-
      {{ octopus_admin_password_generated.stdout | default('') if octopus_admin_password_existing.rc != 0
         else octopus_admin_password_existing.stdout }}
  no_log: true

- name: Write New Octopus Admin Password To Secret Manager (Only If Freshly Generated)
  ansible.builtin.shell: >
    echo -n "{{ octopus_admin_password }}" |
    gcloud secrets versions add {{ secret_octopus_admin_password }}
    --data-file=- --project={{ gcp_project_id }}
  when: octopus_admin_password_existing.rc != 0
  no_log: true
  changed_when: true

- name: Attempt To Read Existing Octopus Admin API Key From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret={{ secret_octopus_admin_api_key }} --project={{ gcp_project_id }}
  register: octopus_admin_api_key_existing
  no_log: true
  changed_when: false
  failed_when: false

# NOTE: Octopus's Expected API Key Format/Validation Isn't Fully Confirmed
# Here — This Generates A Plausible API-Prefixed Random Key. Verify
# Against Current Octopus Docs Before A Real Run; If Octopus Rejects It,
# Fall Back To Leaving ADMIN_API_KEY Unset And Generating A Key Via The
# UI/REST API Post-Boot Instead.
- name: Generate New Octopus Admin API Key (Only If None Exists Yet)
  ansible.builtin.shell: echo "API-$(openssl rand -hex 16 | tr '[:lower:]' '[:upper:]')"
  register: octopus_admin_api_key_generated
  no_log: true
  changed_when: false
  when: octopus_admin_api_key_existing.rc != 0

- name: Set Octopus Admin API Key Fact
  ansible.builtin.set_fact:
    octopus_admin_api_key: >-
      {{ octopus_admin_api_key_generated.stdout | default('') if octopus_admin_api_key_existing.rc != 0
         else octopus_admin_api_key_existing.stdout }}
  no_log: true

- name: Write New Octopus Admin API Key To Secret Manager (Only If Freshly Generated)
  ansible.builtin.shell: >
    echo -n "{{ octopus_admin_api_key }}" |
    gcloud secrets versions add {{ secret_octopus_admin_api_key }}
    --data-file=- --project={{ gcp_project_id }}
  when: octopus_admin_api_key_existing.rc != 0
  no_log: true
  changed_when: true

# --- Compose File + .env + Container Start ---
- name: Ensure Octopus Compose Directory Exists
  ansible.builtin.file:
    path: "{{ octopus_compose_dir }}"
    state: directory
    mode: "0750"

- name: Write Octopus/Mssql .env File
  ansible.builtin.template:
    src: octopus.env.j2
    dest: "{{ octopus_compose_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Template Octopus/Mssql Docker Compose File
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ octopus_compose_dir }}/docker-compose.yml"
    mode: "0640"

- name: Start Mssql + Octopus Containers Via Docker Compose
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ octopus_compose_dir }}"
  register: octopus_compose_up
  changed_when: "'Started' in octopus_compose_up.stdout or 'Created' in octopus_compose_up.stdout"

- name: Wait For Mssql Container To Report Healthy
  ansible.builtin.command: >
    docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ mssql_container_name }}
  register: mssql_health
  until: mssql_health.stdout == "healthy"
  retries: 20
  delay: 5
  changed_when: false

- name: Wait For Octopus API To Respond
  ansible.builtin.uri:
    url: "http://localhost:{{ octopus_web_port }}/api"
    status_code: 200
  register: octopus_api_check
  until: octopus_api_check.status == 200
  retries: 30
  delay: 10

- name: Include Mssql Backup Tasks
  ansible.builtin.include_tasks: backup.yml
