---
# Octopus Deploy Has No Native Linux Binary Install — Confirmed From
# https://octopus.com/docs/installation/octopus-server-linux-container:
# Linux Is Container-Only. 
# Containers (mssql, octopus-server) Run From One Docker Compose File,
# Per Octopus's Own Reference Compose Setup.

octopus_compose_dir: /opt/octopus
octopus_data_dir: /opt/octopus/data

sql_data_disk_name: "sql-data"

mssql_image: "mcr.microsoft.com/mssql/server:2022-latest"
mssql_container_name: "octopus-mssql"

octopus_server_tag: "2026.2.13364"
octopus_container_name: "octopus-server"
octopus_web_port: 8080
octopus_tentacle_port: 10943

octopus_node_name: "mgmt-vm"
octopus_admin_username: "admin"
octopus_admin_email: "silasfrancis07@gmail.com"

# Docker-In-Docker Powers Octopus's Worker Container Support — Not Used In
# This Project (No Worker Containers Planned), So Disabled. This Also
# Means privileged Can Stay False; It's Only Required When DinD Is On.
octopus_disable_dind: "Y"
octopus_privileged: "false"

# Backup
mssql_backup_gcs_bucket: " nomad-platform-gcp-europe-west1-platform-artifacts"
mssql_backup_gcs_prefix: "sql-backups"
mssql_backup_schedule: "*-*-* 03:00:00"
