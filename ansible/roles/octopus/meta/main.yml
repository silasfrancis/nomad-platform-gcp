---
galaxy_info:
  role_name: octopus
  description: >
    Runs Octopus Deploy Server and SQL Server Express as two containers
    in one Docker Compose file, per Octopus's own official Linux
    installation docs (Linux has no native binary install — container
    only). Mssql is folded in here rather than being a separate role
    since nothing else consumes SQL Server Express. Environments,
    projects, and deployment targets are created by the Terraform
    service-config layer, not this role.
  min_ansible_version: "2.15"

dependencies:
  - common
