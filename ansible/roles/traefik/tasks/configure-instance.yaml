---
# Per-Instance Setup — Included Once Per Entry In
# traefik_instances_to_configure. traefik_instance Is The Current Loop
# Item; Everything Here Is Scoped To Its Own Config/Log Directories And
# Its Own Systemd Unit So Instances Sharing A Host Never Share State.

- name: "[{{ traefik_instance.name }}] Create Config, Dynamic, TLS, And Log Directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0750"
  loop:
    - "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}"
    - "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}/dynamic"
    - "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}/tls"
    - "{{ traefik_base_log_dir }}/{{ traefik_instance.name }}"

# Only Instances With Fixed Admin-API/Tool Backends Need This — The
# Public Instances (static_routes: []) Route Purely Through
# consulCatalog And Never Need To Know A Backend's GCE Instance Name.
- name: "[{{ traefik_instance.name }}] Resolve Backend Instance FQDN(s)"
  ansible.builtin.include_tasks: fetch-instance-fqdns.yaml
  vars:
    target_filter: "{{ traefik_instance.backend_instance_filter }}"
  when: traefik_instance.static_routes | length > 0

# consulCatalog Is Skipped Entirely For mgmt (catalog_env: ~) — Vault/
# Octopus/Grafana Are All Fixed Backends, No Consul Involvement At All.
# For Every Other Instance, This Is The Idempotent Check: The First
# Time This Runs Against dev-internal/prod-internal, Before Dev's/
# Prod's Own platform-config Terraform Has Applied, The Secret Doesn't
# Exist Yet And catalog_enabled Comes Out False — consulCatalog Is Left
# Out Of The Rendered Config Entirely. Re-Running The Same Playbook
# Later (Once The Secret Exists) Picks It Up Automatically. For
# dev-public/prod-public The Token Already Exists From Earlier Work, So
# This Just Resolves True Immediately — Same Check, No Special-Casing.
- name: "[{{ traefik_instance.name }}] Check Whether This Environment's Catalog Token Exists Yet"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-traefik-token-{{ traefik_instance.catalog_env }} --project={{ gcp_project_id }}
  register: _catalog_token_read
  no_log: true
  changed_when: false
  failed_when: false
  when: traefik_instance.catalog_env is not none

- name: "[{{ traefik_instance.name }}] Fetch This Environment's CA Certificate (Only If Its Token Exists)"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=ca-cert-{{ traefik_instance.catalog_env }} --project={{ gcp_project_id }}
  register: _ca_cert_read
  changed_when: false
  when:
    - traefik_instance.catalog_env is not none
    - _catalog_token_read.rc == 0
    - _catalog_token_read.stdout | length > 0

- name: "[{{ traefik_instance.name }}] Determine Whether consulCatalog Should Be Enabled This Run"
  ansible.builtin.set_fact:
    catalog_enabled: >-
      {{
        traefik_instance.catalog_env is not none
        and _catalog_token_read is defined
        and _catalog_token_read.rc == 0
        and (_catalog_token_read.stdout | length > 0)
      }}

- name: "[{{ traefik_instance.name }}] Write CA Certificate"
  ansible.builtin.copy:
    content: "{{ _ca_cert_read.stdout }}"
    dest: "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}/tls/ca.pem"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0640"
  when: catalog_enabled

- name: "[{{ traefik_instance.name }}] Template Static Traefik Configuration"
  ansible.builtin.template:
    src: traefik.yaml.j2
    dest: "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}/traefik.yaml"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0640"
  register: _static_config

# Skipped For The Public Instances — They Have No static_routes, So
# There's Nothing For This Template To Render.
- name: "[{{ traefik_instance.name }}] Template Dynamic Routes (Static Admin-API/Tool Passthrough)"
  ansible.builtin.template:
    src: internal-routes.yaml.j2
    dest: "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}/dynamic/routes.yaml"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0640"
  register: _dynamic_routes
  when: traefik_instance.static_routes | length > 0

- name: "[{{ traefik_instance.name }}] Write Environment File (Cloudflare Token, DNS-01 Instances Only)"
  ansible.builtin.copy:
    dest: "{{ traefik_base_config_dir }}/{{ traefik_instance.name }}/traefik.env"
    content: "CF_DNS_API_TOKEN={{ cloudflare_token_read.stdout }}\n"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0600"
  no_log: true
  when: traefik_instance.challenge == 'dns-01'

- name: "[{{ traefik_instance.name }}] Template Systemd Unit"
  ansible.builtin.template:
    src: traefik.service.j2
    dest: "/etc/systemd/system/traefik-{{ traefik_instance.name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: _systemd_unit

- name: "[{{ traefik_instance.name }}] Reload Systemd Daemon"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _systemd_unit.changed

- name: "[{{ traefik_instance.name }}] Enable Traefik Instance"
  ansible.builtin.systemd:
    name: "traefik-{{ traefik_instance.name }}"
    enabled: true
    state: started

- name: "[{{ traefik_instance.name }}] Restart If Config Changed"
  ansible.builtin.systemd:
    name: "traefik-{{ traefik_instance.name }}"
    state: restarted
  when: >-
    _static_config.changed
    or (_dynamic_routes is defined and _dynamic_routes.changed)
    or _systemd_unit.changed
