---
# Native Binary + Systemd, Not Docker. This Role Is Shared By Every
# Traefik Process In The Platform — Which Ones Actually Get Configured
# On This Host Is Entirely Down To traefik_active_instances, Set By
# The Calling Playbook (Not By This Role). See defaults/main.yaml For
# What Each Named Instance In The Catalog Actually Is.

- name: Fail Loudly If No Instances Were Selected
  ansible.builtin.fail:
    msg: >-
      traefik_active_instances is empty — the calling playbook must
      set it to one or more names from traefik_instance_catalog
      (e.g. [mgmt, dev-internal, prod-internal] for traefik-internal,
      or [dev-public] for traefik-dev's own playbook).
  when: traefik_active_instances | length == 0

- name: Resolve Selected Instances From The Catalog
  ansible.builtin.set_fact:
    traefik_instances_to_configure: >-
      {{
        traefik_instance_catalog
        | selectattr('name', 'in', traefik_active_instances)
        | list
      }}

- name: Fail Loudly If A Selected Name Doesn't Exist In The Catalog
  ansible.builtin.fail:
    msg: >-
      traefik_active_instances names {{ traefik_active_instances }},
      but only {{ traefik_instances_to_configure | map(attribute='name') | list }}
      were found in traefik_instance_catalog — check for a typo.
  when: (traefik_instances_to_configure | length) != (traefik_active_instances | length)

- name: Create Traefik Group
  ansible.builtin.group:
    name: "{{ traefik_group }}"
    system: true

- name: Create Traefik User
  ansible.builtin.user:
    name: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ traefik_base_config_dir }}"
    create_home: false

- name: Download And Extract Traefik Binary
  ansible.builtin.unarchive:
    src: "{{ traefik_download_url }}"
    dest: /tmp
    remote_src: true
    creates: /tmp/traefik

- name: Install Traefik Binary
  ansible.builtin.copy:
    src: /tmp/traefik
    dest: "{{ traefik_bin_dir }}/traefik"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Grant Traefik Binary Port-Binding Capability (No Root Needed For Any Listening Port, Including 80/443)
  community.general.capabilities:
    path: "{{ traefik_bin_dir }}/traefik"
    capability: cap_net_bind_service+ep
    state: present

- name: Read Cloudflare API Token (Only Needed If Any Selected Instance Uses DNS-01)
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret={{ secret_cloudflare_api_token }} --project={{ gcp_project_id }}
  register: cloudflare_token_read
  no_log: true
  changed_when: false
  when: traefik_instances_to_configure | selectattr('challenge', 'equalto', 'dns-01') | list | length > 0

- name: Configure Each Selected Traefik Instance
  ansible.builtin.include_tasks: configure-instance.yaml
  loop: "{{ traefik_instances_to_configure }}"
  loop_control:
    loop_var: traefik_instance
    label: "{{ traefik_instance.name }}"
