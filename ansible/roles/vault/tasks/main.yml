---
# Install + Configure + Start Only. `vault operator init` Lives In
# tasks/init.yml, Called Only By playbooks/vault-init.yml — Never From
# This File — Since It's A Genuine One-Time Operation That Must Not Run
# As Part Of A Routine site.yml/mgmt.yml Pass.

- name: Create Vault Group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    system: true

- name: Create Vault User
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vault_data_dir }}"
    create_home: false

- name: Create Vault Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0750"
  loop:
    - "{{ vault_config_dir }}"
    - "{{ vault_tls_dir }}"
    - "{{ vault_data_dir }}"
    - "{{ vault_log_dir }}"

- name: Download And Unarchive Vault Binary
  ansible.builtin.unarchive:
    src: "{{ vault_download_url }}"
    dest: "{{ vault_bin_dir }}"
    remote_src: true
    mode: "0755"
    creates: "{{ vault_bin_dir }}/vault"

- name: Grant Vault Binary mlock Capability
  community.general.capabilities:
    path: "{{ vault_bin_dir }}/vault"
    capability: cap_ipc_lock+ep
    state: present

# --- Vault's Cert: Fetched Directly From Secret Manager — Generated By
# scripts/generate-and-push-pki.sh (Run From Your Laptop), Not By This
# Role Anymore. Every Node That Needs A Cert Now Fetches From Secret
# Manager Directly, Rather Than Ansible Generating Locally Or Distributing
# Files Between Hosts.
- name: Fetch Vault Certificate From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=vault-cert --project={{ gcp_project_id }}
  register: vault_cert_fetch
  changed_when: false

- name: Fetch Vault Private Key From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=vault-key --project={{ gcp_project_id }}
  register: vault_key_fetch
  no_log: true
  changed_when: false

- name: Write Vault Certificate
  ansible.builtin.copy:
    content: "{{ vault_cert_fetch.stdout }}"
    dest: "{{ vault_tls_dir }}/vault-cert.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0644"

- name: Write Vault Private Key
  ansible.builtin.copy:
    content: "{{ vault_key_fetch.stdout }}"
    dest: "{{ vault_tls_dir }}/vault-key.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0600"
  no_log: true

# --- Attached vault-data Disk — Raft Storage Must Live Here, Never On The
# Boot Disk. fstab Entry Only; Formatting/Mounting Happens Below, Guarded
# So It's Safe Whether The Disk Is Already Formatted Or Not. ---
- name: Check If Vault Data Disk Is Already Formatted
  ansible.builtin.command: blkid /dev/disk/by-id/google-vault-data
  register: vault_disk_blkid
  failed_when: false
  changed_when: false

- name: Format Vault Data Disk (Only If Unformatted)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/disk/by-id/google-vault-data
  when: vault_disk_blkid.rc != 0

- name: Add Vault Data Disk Fstab Entry And Mount
  ansible.posix.mount:
    path: "{{ vault_data_dir }}"
    src: /dev/disk/by-id/google-vault-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Ensure Vault Data Directory Ownership
  ansible.builtin.file:
    path: "{{ vault_data_dir }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0750"
    state: directory

# --- Configuration + Service ---
- name: Template Vault Configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0640"
  notify: Restart Vault

- name: Template Vault Systemd Unit
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload Systemd Daemon

- name: Enable And Start Vault
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started
    daemon_reload: true

- name: Include Vault Backup Tasks
  ansible.builtin.include_tasks: backup.yml
