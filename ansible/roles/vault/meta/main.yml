---
galaxy_info:
  role_name: vault
  description: >
    Installs Vault, generates a self-signed TLS cert, mounts the
    vault-data disk, and starts the service with GCP KMS auto-unseal
    configured. tasks/init.yml (operator init + Secret Manager writes +
    audit enable) is separate and only ever invoked by
    playbooks/vault-init.yml, never as part of a routine role run.
  min_ansible_version: "2.15"

dependencies:
  - common
