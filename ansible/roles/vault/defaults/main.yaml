---
vault_version: "2.0.3"

vault_user: vault
vault_group: vault

vault_bin_dir: /usr/local/bin
vault_config_dir: /etc/vault.d
vault_tls_dir: /etc/vault.d/tls
vault_data_dir: /opt/vault/data
vault_log_dir: /var/log/vault

vault_download_url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"

# Vault Is A Project-Wide Singleton On mgmt-vm — These Are Genuinely
# Static, Safe To Bake. Override With Real Values From
# terraform_remote_state (bootstrap Outputs) At Run Time.
gcp_project_id: ""
gcp_kms_region: "europe-west1"
gcp_kms_key_ring: "vault-unseal"
gcp_kms_crypto_key: "vault-unseal-cmek"
secret_management_ca_cert: ""
secret_vault_cert: "vault-cert"
secret_vault_tls_key: "vault-tls-key"

vault_listener_address: "0.0.0.0:8200"
vault_ui_enabled: true
vault_manual_root_token: ""

# Backup
vault_snapshot_gcs_bucket: " nomad-platform-gcp-europe-west1-platform-artifacts"
vault_snapshot_gcs_prefix: "vault-snapshots"
vault_snapshot_schedule: "*-*-* 02:00:00"

vault_data_disk_name: "mgmt-vm-vault-data"
vault_internal_dns: "mgmt-vm.europe-west1-b.c.nomad-platform-gcp.internal"
vault_local_addr: "https://127.0.0.1:8200"