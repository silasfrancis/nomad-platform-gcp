---
common_packages:
  - curl
  - wget
  - unzip
  - git
  - jq
  - htop
  - gnupg
  - ca-certificates
  - chrony

common_enable_unattended_upgrades: true

# Automatic Reboots Are Deliberately Disabled — A Reboot Mid-Raft-Election
# Or Mid-Allocation Would Be Worse Than A Delayed Security Patch.
common_unattended_upgrades_auto_reboot: false

common_timezone: "UTC"

common_disable_ssh_password_auth: true
common_disable_ssh_root_login: true

common_sysctl_settings:
  vm.max_map_count: 262144
  fs.file-max: 1000000
  net.core.somaxconn: 65535
  net.ipv4.tcp_max_syn_backlog: 65535
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
