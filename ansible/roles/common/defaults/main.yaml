---
common_packages:
  - curl
  - wget
  - unzip
  - git
  - jq
  - htop
  - gnupg
  - ca-certificates
  - chrony
  - python3
  - python3-pip 
  - python3-venv
  - python3-yaml
  - dnsutils

common_enable_unattended_upgrades: true

# Automatic Reboots Are Deliberately Disabled — A Reboot Mid-Raft-Election
# Or Mid-Allocation Would Be Worse Than A Delayed Security Patch.
common_unattended_upgrades_auto_reboot: false

common_timezone: "UTC"

common_disable_ssh_password_auth: true
common_disable_ssh_root_login: true

# mgmt-vm Needs This For Its Backup Scripts (Vault Snapshot, Octopus SQL
# Dump) Plus Vault/Octopus's Own Secret Manager Reads. nomad-server And
# nomad-client ALSO Need This Now — Every Node Fetches Its Own TLS
# Material Directly From Secret Manager (See consul/nomad Roles), Rather
# Than Anything Being Distributed By Ansible Between Hosts.
common_install_gcloud_cli: false

common_sysctl_settings:
  vm.max_map_count: 262144
  fs.file-max: 1000000
  net.core.somaxconn: 65535
  net.ipv4.tcp_max_syn_backlog: 65535
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
