---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# ca-certificates is kept as an explicit prerequisite to match Docker's own
# install docs, even though Ansible's get_url module (used below to fetch
# the gpg key) is native Python and doesn't need curl the way the upstream
# shell instructions do.
docker_prereq_packages:
  - ca-certificates

docker_log_max_size: "10m"
docker_log_max_file: "3"
docker_storage_driver: "overlay2"

# Which system user(s) need docker group membership — set per-playbook,
# not shared, since each playbook targets a different host with a
# different user that actually exists there.
# nomad-clients.yaml passes ["nomad"] (Nomad's Docker driver needs it).
# mgmt.yaml passes ["gh-runner"] (the self-hosted runner builds and pushes
# images via docker buildx, so it needs direct socket access — Octopus's
# own mssql step doesn't need this, since Ansible drives docker compose
# as root at bootstrap time, not gh-runner).
docker_extra_group_users: []

# Only used by tasks/mount-docker-data-disk.yaml, which is never called
# from main.yaml. Left blank so a caller must set it explicitly — see the
# assert at the top of that task file. mgmt.yaml is currently the only
# playbook that calls this task, passing docker_data_disk_name:
# "mgmt-vm-docker-data".
docker_data_disk_name: ""
docker_data_mount_path: /var/lib/docker

# Only used by tasks/schedule-docker-prune.yaml, also never called from
# main.yaml. docker_prune_schedule takes any valid systemd OnCalendar
# expression ("daily", "03:30", "Mon..Fri 02:00", etc). docker_prune_until
# matches the age filter used by scripts/prune-docker-mgmt.sh, so the
# manual and scheduled paths reclaim on the same criteria by default.
docker_prune_schedule: "daily"
docker_prune_until: "72h"
docker_prune_include_volumes: false