---
# NOTE: ACL Bootstrap + Tokens Are Handled By The Terraform service-config
# Layer, Not By Ansible. This Role Only Turns The acl.enabled Feature Flag
# On — It Never Runs `consul acl bootstrap` Or Manages Tokens.
#
# consul_datacenter / consul_retry_join / consul_bootstrap_expect Come From
# inventory/group_vars/dev.yaml Or prod.yaml When This Role Runs Directly
# Against A Real Host (nomad-servers.yaml, nomad-clients.yaml Run Via
# Dynamic Inventory). When This SAME Role Is Instead Invoked By Packer To
# Bake The Shared nomad-client-mig Image, No Env-Specific Group Vars Are
# In Scope — consul.hcl.j2 Simply Omits Those Lines In That Case, And The
# GCP Startup Script Supplies Them In A Separate 99-instance.hcl At Real
# Boot (Merged By Consul's Directory-Based Config Loading).

- name: Create Consul Group
  ansible.builtin.group:
    name: "{{ consul_group }}"
    system: true

- name: Create Consul User
  ansible.builtin.user:
    name: "{{ consul_user }}"
    group: "{{ consul_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ consul_data_dir }}"
    create_home: false

- name: Create Consul Directories (Config + Log Only — data_dir Is Handled Below)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  loop:
    - "{{ consul_config_dir }}"
    - "{{ consul_log_dir }}"
    - "{{ consul_tls_dir }}"

# consul-data Persistent Disk (Server Mode Only)
# Consul Servers Run Their Own Raft Log Here — Job Specs, Evaluations,
# Allocations (Current + Historical), Deployment Tracking, ACL
# Tokens/Policies. Consul Clients Don't Run Raft (No Persistent State Worth
# Protecting), So This Only Applies When consul_mode == "server". Job Specs
# Alone Are Recoverable From Git If Lost — Allocation History, Deployment
# State, And ACLs Are Not.
#
# Assumes The Terraform Disk Resource Is Named "consul-data" — Confirm
# This Matches Whatever Name You Actually Used.
- name: Check If Consul Data Disk Is Already Formatted
  ansible.builtin.command: blkid /dev/disk/by-id/google-consul-data
  register: consul_disk_blkid
  failed_when: false
  changed_when: false
  when: consul_mode == 'server'

- name: Format Nomad Data Disk (Only If Unformatted)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/disk/by-id/google-nomad-data
  when: nomad_mode == 'server' and nomad_disk_blkid.rc != 0

- name: Ensure Nomad Data Mount Point Exists
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    mode: "0750"
  when: nomad_mode == 'server'

- name: Mount Nomad Data Disk
  ansible.posix.mount:
    path: "{{ consul_data_dir }}"
    src: /dev/disk/by-id/google-consul-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  when: consul_mode == 'server'

- name: Ensure Consul Data Directory Ownership After Mount
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
    state: directory
  when: consul_mode == 'server'

- name: Ensure Consul Data Directory Exists (Client Mode — No Persistent Disk)
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  when: consul_mode != 'server'

- name: Download And Unarchive Consul Binary
  ansible.builtin.unarchive:
    src: "{{ consul_download_url }}"
    dest: "{{ consul_bin_dir }}"
    remote_src: true
    mode: "0755"
    creates: "{{ consul_bin_dir }}/consul"

- name: Compute this instance's systemd service name
  ansible.builtin.set_fact:
    consul_service_name: "{{ 'consul-' + consul_instance_name if consul_instance_name else 'consul' }}"

- name: Template Consul Configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0640"
  register: consul_config_result

- name: Template Consul Systemd Unit
  ansible.builtin.template:
    src: consul.service.j2
    dest: "/etc/systemd/system/{{ consul_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: consul_unit_result

- name: Reload systemd daemon (unit file changed)
  ansible.builtin.systemd:
    daemon_reload: true
  when: consul_unit_result.changed

- name: Enable Consul service
  ansible.builtin.systemd:
    name: "{{ consul_service_name }}"
    enabled: true
    daemon_reload: true

- name: Start Consul (only when running directly against a real host)
  ansible.builtin.systemd:
    name: "{{ consul_service_name }}"
    state: started
  when: consul_datacenter is defined

- name: Restart Consul if config changed (only when already started)
  ansible.builtin.systemd:
    name: "{{ consul_service_name }}"
    state: restarted
  when:
    - consul_datacenter is defined
    - consul_config_result.changed