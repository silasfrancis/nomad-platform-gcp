---
# NOTE: ACL Bootstrap + Tokens Are Handled By The Terraform service-config
# Layer, Not By Ansible. This Role Only Turns The acl.enabled Feature Flag
# On — It Never Runs `consul acl bootstrap` Or Manages Tokens.
#
# consul_datacenter / consul_retry_join / consul_bootstrap_expect Come From
# inventory/group_vars/dev.yml Or prod.yml When This Role Runs Directly
# Against A Real Host (nomad-servers.yml, nomad-clients.yml Run Via
# Dynamic Inventory). When This SAME Role Is Instead Invoked By Packer To
# Bake The Shared nomad-client-mig Image, No Env-Specific Group Vars Are
# In Scope — consul.hcl.j2 Simply Omits Those Lines In That Case, And The
# GCP Startup Script Supplies Them In A Separate 99-instance.hcl At Real
# Boot (Merged By Consul's Directory-Based Config Loading).

- name: Create Consul Group
  ansible.builtin.group:
    name: "{{ consul_group }}"
    system: true

- name: Create Consul User
  ansible.builtin.user:
    name: "{{ consul_user }}"
    group: "{{ consul_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ consul_data_dir }}"
    create_home: false

- name: Create Consul Directories (Config + Log Only — data_dir Is Handled Below)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  loop:
    - "{{ consul_config_dir }}"
    - "{{ consul_log_dir }}"

# --- consul-data Persistent Disk (Server Mode Only) ---
# Consul Servers Run Their Own Raft Log Here — KV Store, Full Service
# Catalog, ACL Tokens/Policies, Connect Intentions, Session State. Client
# Agents Don't Participate In Raft (No Persistent State Worth Protecting),
# So This Only Applies When consul_mode == "server". Without This Disk,
# destroy/recreate Of compute/ Between Sessions Silently Wipes All Of It.
#
# Assumes The Terraform Disk Resource Is Named "consul-data" — Confirm
# This Matches Whatever Name You Actually Used.
- name: Check If Consul Data Disk Is Already Formatted
  ansible.builtin.command: blkid /dev/disk/by-id/google-consul-data
  register: consul_disk_blkid
  failed_when: false
  changed_when: false
  when: consul_mode == 'server'

- name: Format Consul Data Disk (Only If Unformatted)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/disk/by-id/google-consul-data
  when: consul_mode == 'server' and consul_disk_blkid.rc != 0

- name: Ensure Consul Data Mount Point Exists
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    mode: "0750"
  when: consul_mode == 'server'

- name: Mount Consul Data Disk
  ansible.posix.mount:
    path: "{{ consul_data_dir }}"
    src: /dev/disk/by-id/google-consul-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  when: consul_mode == 'server'

- name: Ensure Consul Data Directory Ownership After Mount
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
    state: directory
  when: consul_mode == 'server'

# Client Mode (No Persistent Disk) — Just A Plain Local Directory.
- name: Ensure Consul Data Directory Exists (Client Mode — No Persistent Disk)
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  when: consul_mode != 'server'

- name: Download And Unarchive Consul Binary
  ansible.builtin.unarchive:
    src: "{{ consul_download_url }}"
    dest: "{{ consul_bin_dir }}"
    remote_src: true
    mode: "0755"
    creates: "{{ consul_bin_dir }}/consul"

# --- TLS: Everything Fetched Directly From Secret Manager — Generated
# Centrally By scripts/generate-and-push-pki.sh
# Uniform Pattern Regardless Of Direct Run Or Packer Bake: This
# Host Fetches What It Needs Itself, No Local-File Distribution Involved.
# Requires gcloud Installed (common_install_gcloud_cli: true) And This
# Host's Service Account To Have secretAccessor On The Secrets Fetched
# Below.
- name: Create Consul TLS Directory
  ansible.builtin.file:
    path: "{{ consul_tls_dir }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"

- name: Fetch Consul CA Certificate From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-ca-cert --project={{ gcp_project_id }}
  register: consul_ca_fetch
  changed_when: false

- name: Write Consul CA Certificate
  ansible.builtin.copy:
    content: "{{ consul_ca_fetch.stdout }}"
    dest: "{{ consul_tls_dir }}/ca.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"

# --- Server/Client Cert + Key + Gossip Key: Only Fetched When
# consul_datacenter Is In Scope (Direct Runs Against Real Hosts — Server
# Nodes Always, Or A By-Hand Run Against A Live Client). When This Role Is
# Baked Via Packer For The Shared nomad-client-mig Image, consul_datacenter
# Is Undefined (No Env-Specific Group Vars For The Build VM) — The GCP
# Startup Script Fetches These Same Per-Environment Secrets Itself At Real
# Boot Instead (Via The Instance's Own Service Account Token, Not gcloud),
# Since The Shared Image Can't Contain Env-Specific Material.
- name: Fetch Consul Server/Client Certificate From Secret Manager (Direct Runs Only)
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-{{ consul_mode }}-cert-{{ consul_datacenter | regex_replace('^dc-', '') }}
    --project={{ gcp_project_id }}
  register: consul_leaf_cert_fetch
  changed_when: false
  when: consul_datacenter is defined

- name: Fetch Consul Server/Client Private Key From Secret Manager (Direct Runs Only)
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-{{ consul_mode }}-key-{{ consul_datacenter | regex_replace('^dc-', '') }}
    --project={{ gcp_project_id }}
  register: consul_leaf_key_fetch
  no_log: true
  changed_when: false
  when: consul_datacenter is defined

- name: Write Consul Server/Client Certificate (Direct Runs Only)
  ansible.builtin.copy:
    content: "{{ consul_leaf_cert_fetch.stdout }}"
    dest: "{{ consul_tls_dir }}/cert.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  when: consul_datacenter is defined

- name: Write Consul Server/Client Private Key (Direct Runs Only)
  ansible.builtin.copy:
    content: "{{ consul_leaf_key_fetch.stdout }}"
    dest: "{{ consul_tls_dir }}/key.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0600"
  no_log: true
  when: consul_datacenter is defined

- name: Fetch Consul Gossip Encryption Key From Secret Manager (Direct Runs Only)
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-gossip-key-{{ consul_datacenter | regex_replace('^dc-', '') }}
    --project={{ gcp_project_id }}
  register: consul_gossip_key_fetch
  no_log: true
  changed_when: false
  when: consul_datacenter is defined

- name: Set Consul Gossip Key Fact (Direct Runs Only)
  ansible.builtin.set_fact:
    consul_gossip_key: "{{ consul_gossip_key_fetch.stdout }}"
  no_log: true
  when: consul_datacenter is defined

- name: Template Consul Configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0640"
  register: consul_config_result

- name: Template Consul Systemd Unit
  ansible.builtin.template:
    src: consul.service.j2
    dest: /etc/systemd/system/consul.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload Systemd Daemon

# Only Start The Service When Enough Info Is Actually Present To Produce A
# Working Config (i.e. Direct Runs Against Real Hosts). During A Packer
# Bake, consul_datacenter Is Undefined, So This Is Skipped — Enabled Only,
# Matching The "Enabled But Not Started At Bake Time" Design.
- name: Enable Consul Service
  ansible.builtin.systemd:
    name: consul
    enabled: true
    daemon_reload: true

- name: Start Consul (Only When Running Directly Against A Real Host)
  ansible.builtin.systemd:
    name: consul
    state: started
  when: consul_datacenter is defined

- name: Restart Consul If Config Changed (Only When Already Started)
  ansible.builtin.systemd:
    name: consul
    state: restarted
  when:
    - consul_datacenter is defined
    - consul_config_result.changed
