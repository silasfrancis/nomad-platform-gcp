# Fetch Consul TLS Materials, Gossip Key, And Agent Token From Secret
# Manager Directly Via Ansible.
#
# Only included when consul_fetch_secrets_via_ansible is true — mgmt-vm
# only. Requires consul_instance_name ("dev" or "prod") to know which
# environment's secrets to pull.
#
# mgmt-vm never needs nomad-client-consul-token — that's Nomad's own
# credential for its consul{} block, and mgmt-vm doesn't run Nomad.

- name: "[{{ consul_instance_name }}] Fetch CA certificate"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=ca-cert-{{ consul_instance_name }} --project={{ gcp_project_id }}
  register: consul_ca_cert_fetch
  changed_when: false

- name: "[{{ consul_instance_name }}] Fetch client cert"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-client-cert-{{ consul_instance_name }} --project={{ gcp_project_id }}
  register: consul_client_cert_fetch
  changed_when: false

- name: "[{{ consul_instance_name }}] Fetch client key"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-client-tls-key-{{ consul_instance_name }} --project={{ gcp_project_id }}
  register: consul_client_key_fetch
  no_log: true
  changed_when: false

- name: "[{{ consul_instance_name }}] Fetch gossip key"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-gossip-key-{{ consul_instance_name }} --project={{ gcp_project_id }}
  register: consul_gossip_key_fetch
  no_log: true
  changed_when: false

- name: "[{{ consul_instance_name }}] Fetch agent token"
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=consul-client-agent-token-{{ consul_instance_name }} --project={{ gcp_project_id }}
  register: consul_agent_token_fetch
  no_log: true
  changed_when: false

- name: "[{{ consul_instance_name }}] Write CA certificate"
  ansible.builtin.copy:
    content: "{{ consul_ca_cert_fetch.stdout }}"
    dest: "{{ consul_tls_dir }}/ca.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"

- name: "[{{ consul_instance_name }}] Write client cert"
  ansible.builtin.copy:
    content: "{{ consul_client_cert_fetch.stdout }}"
    dest: "{{ consul_tls_dir }}/cert.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"

- name: "[{{ consul_instance_name }}] Write client key"
  ansible.builtin.copy:
    content: "{{ consul_client_key_fetch.stdout }}"
    dest: "{{ consul_tls_dir }}/key.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0600"
  no_log: true

- name: "[{{ consul_instance_name }}] Save gossip key + agent token for the template"
  ansible.builtin.set_fact:
    consul_gossip_key: "{{ consul_gossip_key_fetch.stdout }}"
    consul_agent_token: "{{ consul_agent_token_fetch.stdout }}"
  no_log: true