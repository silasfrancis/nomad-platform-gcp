---
galaxy_info:
  role_name: grafana
  description: >
    Runs the pre-built Grafana image (monitoring/grafana/ — its own
    Dockerfile, provisioning configs and dashboards baked in at build
    time, same shared CI pipeline as every other monitoring tool) on
    mgmt-vm via Docker Compose. It is the one central point for
    viewing both dev's and prod's Prometheus/Loki data, so it doesn't
    belong to either cluster.
  min_ansible_version: "2.15"

dependencies:
  - common
  - docker
