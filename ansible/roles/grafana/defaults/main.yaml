---
# ansible-grafana-role/grafana/defaults/main.yaml
#
# Grafana runs on mgmt-vm via Docker Compose, not Nomad — the one
# monitoring tool that isn't per-environment, so it doesn't belong to
# either Nomad cluster. Unlike prior versions of this role, this one
# templates almost nothing: provisioning configs and dashboards are
# baked into monitoring/grafana/'s own image at build time (same
# shared CI pipeline as every other monitoring tool), so all this
# role actually does is fetch the admin password and run the
# pre-built image.

gcp_project_id: "{{ gcp_project_id }}"

grafana_base_dir: /opt/grafana

gcp_registry_host:  europe-west1-docker.pkg.dev
artifact_registry: "{{ gcp_registry_host }}/nomad-platform-gcp/nomad-platform-gcp"
image_tag: 75c8c1e7
grafana_image: "{{ artifact_registry }}/grafana:{{ image_tag }}"

grafana_port: 3000

gcp_secret_grafana_admin_password: "grafana-admin-password"