# CNI Plugins — Bridge Networking For Consul Connect
# Reference CNI plugins provide bridge/host-local/loopback/portmap, the
# low-level primitives Nomad's bridge network mode needs.
# consul-cni integrates Consul Connect with the CNI networking stack.
# Nomad invokes it while preparing an allocation's network namespace,
# allowing transparent proxy redirection for Connect-enabled workloads.

- name: Ensure /opt/cni/bin exists
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download CNI reference plugins
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-amd64-v{{ cni_plugins_version }}.tgz"
    dest: "/tmp/cni-plugins-v{{ cni_plugins_version }}.tgz"
    mode: "0644"

- name: Extract CNI reference plugins to /opt/cni/bin
  ansible.builtin.unarchive:
    src: "/tmp/cni-plugins-v{{ cni_plugins_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true
    owner: root
    group: root

- name: Download consul-cni plugin
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/consul-cni/{{ consul_cni_version }}/consul-cni_{{ consul_cni_version }}_linux_amd64.zip"
    dest: "/tmp/consul-cni_{{ consul_cni_version }}_linux_amd64.zip"
    mode: "0644"

- name: Extract consul-cni to /opt/cni/bin
  ansible.builtin.unarchive:
    src: "/tmp/consul-cni_{{ consul_cni_version }}_linux_amd64.zip"
    dest: /opt/cni/bin
    remote_src: true
    owner: root
    group: root

- name: Ensure required CNI binaries are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - /opt/cni/bin/bridge
    - /opt/cni/bin/host-local
    - /opt/cni/bin/loopback
    - /opt/cni/bin/portmap
    - /opt/cni/bin/consul-cni

- name: Verify required CNI binaries are installed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/cni/bin/bridge
    - /opt/cni/bin/host-local
    - /opt/cni/bin/loopback
    - /opt/cni/bin/portmap
    - /opt/cni/bin/consul-cni
  register: cni_plugin_stats

- name: Fail if any required CNI plugin is missing
  ansible.builtin.fail:
    msg: "Required CNI plugin {{ item.stat.path }} was not installed."
  when: not item.stat.exists
  loop: "{{ cni_plugin_stats.results }}"

- name: Clean up downloaded archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/cni-plugins-v{{ cni_plugins_version }}.tgz"
    - "/tmp/consul-cni_{{ consul_cni_version }}_linux_amd64.zip"