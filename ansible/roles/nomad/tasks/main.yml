---
# NOTE: Namespaces + ACL Policies Are Handled By The Terraform
# service-config Layer, Not By Ansible. This Role Only Turns The
# acl.enabled Feature Flag On.
#
# Writes Three Files Into /etc/nomad.d/, Merged By Nomad's Directory-Based
# Config Loading: nomad.hcl (Shared Base) Plus Either server.hcl Or
# client.hcl Depending On nomad_mode. As With The consul Role,
# nomad_datacenter/retry_join/bootstrap_expect Only Render When Group Vars
# Are In Scope (Direct Runs); The GCP Startup Script Fills Them In
# Separately When This Role Is Baked Via Packer For nomad-client-mig.

- name: Create Nomad Group
  ansible.builtin.group:
    name: "{{ nomad_group }}"
    system: true

- name: Create Nomad User
  ansible.builtin.user:
    name: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ nomad_data_dir }}"
    create_home: false

- name: Create Nomad Directories (Config + Log Only — data_dir Is Handled Below)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"
  loop:
    - "{{ nomad_config_dir }}"
    - "{{ nomad_log_dir }}"

# --- nomad-data Persistent Disk (Server Mode Only) ---
# Nomad Servers Run Their Own Raft Log Here — Job Specs, Evaluations,
# Allocations (Current + Historical), Deployment Tracking, ACL
# Tokens/Policies. Nomad Clients Don't Run Raft (No Persistent State Worth
# Protecting), So This Only Applies When nomad_mode == "server". Job Specs
# Alone Are Recoverable From Git If Lost — Allocation History, Deployment
# State, And ACLs Are Not.
#
# Assumes The Terraform Disk Resource Is Named "nomad-data" — Confirm
# This Matches Whatever Name You Actually Used.
- name: Check If Nomad Data Disk Is Already Formatted
  ansible.builtin.command: blkid /dev/disk/by-id/google-nomad-data
  register: nomad_disk_blkid
  failed_when: false
  changed_when: false
  when: nomad_mode == 'server'

- name: Format Nomad Data Disk (Only If Unformatted)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/disk/by-id/google-nomad-data
  when: nomad_mode == 'server' and nomad_disk_blkid.rc != 0

- name: Ensure Nomad Data Mount Point Exists
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    state: directory
    mode: "0750"
  when: nomad_mode == 'server'

- name: Mount Nomad Data Disk
  ansible.posix.mount:
    path: "{{ nomad_data_dir }}"
    src: /dev/disk/by-id/google-nomad-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  when: nomad_mode == 'server'

- name: Ensure Nomad Data Directory Ownership After Mount
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"
    state: directory
  when: nomad_mode == 'server'

# Client Mode (No Persistent Disk) — Just A Plain Local Directory.
- name: Ensure Nomad Data Directory Exists (Client Mode — No Persistent Disk)
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"
  when: nomad_mode != 'server'

- name: Download And Unarchive Nomad Binary
  ansible.builtin.unarchive:
    src: "{{ nomad_download_url }}"
    dest: "{{ nomad_bin_dir }}"
    remote_src: true
    mode: "0755"
    creates: "{{ nomad_bin_dir }}/nomad"

# --- TLS: Everything Fetched Directly From Secret Manager — Generated
# Centrally By scripts/generate-and-push-pki.sh, Not Ansible. Nomad's Own
# Cert Isn't Per-Environment (Dev/Prod Never Federate, So Both Share One
# region = "global" Cert, And The Firewall's deny-dev-to-prod Rule Already
# Blocks Cross-Env Traffic As The Primary Control) — Safe To Fetch/Bake
# Unconditionally Regardless Of Direct Run Or Packer Bake.
- name: Create Nomad TLS Directory
  ansible.builtin.file:
    path: "{{ nomad_tls_dir }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"

- name: Fetch Nomad CA Certificate From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=nomad-ca-cert --project={{ gcp_project_id }}
  register: nomad_ca_fetch
  changed_when: false

- name: Write Nomad CA Certificate
  ansible.builtin.copy:
    content: "{{ nomad_ca_fetch.stdout }}"
    dest: "{{ nomad_tls_dir }}/ca.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"

- name: Fetch Nomad Server/Client Certificate From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=nomad-{{ nomad_mode }}-cert --project={{ gcp_project_id }}
  register: nomad_leaf_cert_fetch
  changed_when: false

- name: Fetch Nomad Server/Client Private Key From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=nomad-{{ nomad_mode }}-key --project={{ gcp_project_id }}
  register: nomad_leaf_key_fetch
  no_log: true
  changed_when: false

- name: Write Nomad Server/Client Certificate
  ansible.builtin.copy:
    content: "{{ nomad_leaf_cert_fetch.stdout }}"
    dest: "{{ nomad_tls_dir }}/cert.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"

- name: Write Nomad Server/Client Private Key
  ansible.builtin.copy:
    content: "{{ nomad_leaf_key_fetch.stdout }}"
    dest: "{{ nomad_tls_dir }}/key.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0600"
  no_log: true

# --- Vault's Cert, So Nomad's vault{} Stanza Can Actually Trust It ---
# Nomad Talks To Vault For Every Workload Identity JWT Auth Exchange —
# Without This, The TLS Handshake Fails Outright Since Vault's Cert Is
# Self-Signed And Not In The System's Default CA Trust Store. 
- name: Fetch Vault Certificate From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=vault-cert --project={{ gcp_project_id }}
  register: vault_cert_fetch_for_nomad
  changed_when: false

- name: Write Vault Certificate (For Nomad's vault{} Stanza To Trust It)
  ansible.builtin.copy:
    content: "{{ vault_cert_fetch_for_nomad.stdout }}"
    dest: "{{ nomad_tls_dir }}/vault-ca.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"

- name: Fetch Nomad Encryption Key From Secret Manager
  ansible.builtin.command: >
    gcloud secrets versions access latest
    --secret=nomad-gossip-key-{{ nomad_datacenter | regex_replace('^dc-', '') }}
    --project={{ gcp_project_id }}
  register: nomad_gossip_key_fetch
  no_log: true
  changed_when: false
  when: nomad_mode == "server"

- name: Set Nomad Gossip Key Fact
  ansible.builtin.set_fact:
    nomad_gossip_key: "{{ nomad_gossip_key_fetch.stdout }}"
  no_log: true
  when: nomad_mode == "server"

- name: Template Base Nomad Configuration
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: "{{ nomad_config_dir }}/nomad.hcl"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0640"
  register: nomad_base_config_result

- name: Template Nomad Server Configuration
  ansible.builtin.template:
    src: nomad-server.hcl.j2
    dest: "{{ nomad_config_dir }}/server.hcl"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0640"
  register: nomad_server_config_result
  when: nomad_mode == 'server'

- name: Template Nomad Client Configuration
  ansible.builtin.template:
    src: nomad-client.hcl.j2
    dest: "{{ nomad_config_dir }}/client.hcl"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0640"
  register: nomad_client_config_result
  when: nomad_mode == 'client'

- name: Template Nomad Systemd Unit
  ansible.builtin.template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload Systemd Daemon

- name: Enable Nomad Service
  ansible.builtin.systemd:
    name: nomad
    enabled: true
    daemon_reload: true

- name: Start Nomad (Only When Running Directly Against A Real Host)
  ansible.builtin.systemd:
    name: nomad
    state: started
  when: nomad_datacenter is defined

- name: Restart Nomad If Config Changed (Only When Already Started)
  ansible.builtin.systemd:
    name: nomad
    state: restarted
  when:
    - nomad_datacenter is defined
    - nomad_base_config_result.changed
    - nomad_server_config_result.changed
    - nomad_client_config_result.changed
