---
- name: Download Falco Apt GPG Key
  ansible.builtin.get_url:
    url: "{{ falco_apt_key_url }}"
    dest: /tmp/falco-archive-keyring.asc
    mode: "0644"

- name: Dearmor Falco Apt GPG Key Into Keyring
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg /tmp/falco-archive-keyring.asc
    creates: /usr/share/keyrings/falco-archive-keyring.gpg

- name: Add Falco Apt Repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/falcosecurity.list
    content: "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] https://download.falco.org/packages/deb stable main\n"
    owner: root
    group: root
    mode: "0644"

- name: Update Apt Cache
  ansible.builtin.apt:
    update_cache: true
- name: Install Falco Package
  ansible.builtin.apt:
    name: falco
    state: present
    update_cache: true

- name: Template Falco Main Configuration
  ansible.builtin.template:
    src: falco.yaml.j2
    dest: "{{ falco_config_dir }}/falco.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Falco

- name: Template Falco Custom Rules
  ansible.builtin.template:
    src: falco_rules.local.yaml.j2
    dest: "{{ falco_config_dir }}/falco_rules.local.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Falco

- name: Enable And Start Falco Service
  ansible.builtin.systemd:
    name: falco
    enabled: true
    state: started
    daemon_reload: true
