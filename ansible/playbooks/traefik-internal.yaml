---
# Runs Against traefik-internal Only. Configures All Three Internal
# Instances In One Pass — They Share A Host But Are Otherwise
# Independent Processes (See traefik/defaults/main.yaml).

- name: Configure traefik-internal
  hosts: role_traefik_internal
  become: true
  vars:
    traefik_active_instances:
      # - mgmt
      - dev-internal
      # - prod-internal
  roles:
    - traefik
