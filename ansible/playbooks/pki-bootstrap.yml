---
# Run ONCE, From Your Laptop, Before The First consul/nomad Role Run And
# Before Baking The nomad-client-mig Packer Image. Everything Here Runs
# On localhost — No Remote Hosts Touched. Output Lands In ../pki-local/
# (Add This To .gitignore — It Holds Private Keys).
#
# DESIGN: Nomad's TLS Material Is NOT Per-Environment — Dev And Prod Are
# Two Fully Isolated Clusters That Never Federate, So Both Can Share One
# region = "global" Cert. Consul's Verification Scheme IS
# Datacenter-Aware, So Its Server/Client Certs Are Generated Once Per
# Environment (dc-dev, dc-prod).
#
# DISTRIBUTION:
#   - Consul/Nomad Server Certs: Copied Directly By nomad-servers.yml From
#     These Local Files (Ansible Runs Directly Against Real Static Hosts —
#     No Secret Manager Round-Trip Needed).
#   - Nomad Client Cert: Baked Directly Into The Shared nomad-client-mig
#     Packer Image (Same For Both Envs, Safe To Bake).
#   - Consul Client Cert + Key + Gossip Key: MUST Go Through Secret
#     Manager, Since They're Per-Environment And The Shared Client Image
#     Can't Contain Env-Specific Material — The GCP Startup Script Fetches
#     Them At Real Boot.
#
# REQUIRES: The 6 Secret Containers Below Must Already Exist In
# terraform/bootstrap's default_secrets Map Before This Runs (Ansible Only
# Writes Versions, Never Creates Containers) — consul-gossip-key-dev,
# consul-gossip-key-prod, consul-client-cert-dev, consul-client-key-dev,
# consul-client-cert-prod, consul-client-key-prod. Grant nomad-client-sa
# secretAccessor On Just These 6 (Not The Whole app Tier) To Keep Scope
# Minimal.

- name: Generate Consul/Nomad CAs And Certs, Distribute Env-Specific Consul Client Material
  hosts: localhost
  connection: local
  become: false
  vars:
    pki_dir: "{{ playbook_dir }}/../pki-local"

  tasks:
    - name: Ensure Local PKI Output Directory Exists
      ansible.builtin.file:
        path: "{{ pki_dir }}"
        state: directory
        mode: "0700"

    # --- Consul CA ---
    - name: Generate Consul CA Private Key
      community.crypto.openssl_privatekey:
        path: "{{ pki_dir }}/consul-ca-key.pem"
        type: RSA
        size: 4096
        mode: "0600"

    - name: Generate Consul CA CSR
      community.crypto.openssl_csr:
        path: "{{ pki_dir }}/consul-ca-csr.pem"
        privatekey_path: "{{ pki_dir }}/consul-ca-key.pem"
        common_name: "Consul CA — nomad-platform-gcp"
        basic_constraints: ["CA:TRUE"]
        basic_constraints_critical: true
        key_usage: ["keyCertSign", "cRLSign"]
        key_usage_critical: true

    - name: Generate Consul CA Certificate (Self-Signed, 10 Years)
      community.crypto.x509_certificate:
        path: "{{ pki_dir }}/consul-ca-cert.pem"
        privatekey_path: "{{ pki_dir }}/consul-ca-key.pem"
        csr_path: "{{ pki_dir }}/consul-ca-csr.pem"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: "0644"

    # --- Nomad CA ---
    - name: Generate Nomad CA Private Key
      community.crypto.openssl_privatekey:
        path: "{{ pki_dir }}/nomad-ca-key.pem"
        type: RSA
        size: 4096
        mode: "0600"

    - name: Generate Nomad CA CSR
      community.crypto.openssl_csr:
        path: "{{ pki_dir }}/nomad-ca-csr.pem"
        privatekey_path: "{{ pki_dir }}/nomad-ca-key.pem"
        common_name: "Nomad CA — nomad-platform-gcp"
        basic_constraints: ["CA:TRUE"]
        basic_constraints_critical: true
        key_usage: ["keyCertSign", "cRLSign"]
        key_usage_critical: true

    - name: Generate Nomad CA Certificate (Self-Signed, 10 Years)
      community.crypto.x509_certificate:
        path: "{{ pki_dir }}/nomad-ca-cert.pem"
        privatekey_path: "{{ pki_dir }}/nomad-ca-key.pem"
        csr_path: "{{ pki_dir }}/nomad-ca-csr.pem"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: "0644"

    # --- Consul Server + Client Certs, Per Environment ---
    - name: Generate Consul Server/Client Private Keys (Per Environment)
      community.crypto.openssl_privatekey:
        path: "{{ pki_dir }}/consul-{{ item.role }}-key-{{ item.env }}.pem"
        type: RSA
        size: 4096
        mode: "0600"
      loop:
        - { role: server, env: dev }
        - { role: server, env: prod }
        - { role: client, env: dev }
        - { role: client, env: prod }
      loop_control:
        label: "consul {{ item.role }} ({{ item.env }})"

    - name: Generate Consul Server/Client CSRs (Per Environment, Consul SAN Convention)
      community.crypto.openssl_csr:
        path: "{{ pki_dir }}/consul-{{ item.role }}-csr-{{ item.env }}.pem"
        privatekey_path: "{{ pki_dir }}/consul-{{ item.role }}-key-{{ item.env }}.pem"
        common_name: "{{ item.role }}.dc-{{ item.env }}.consul"
        subject_alt_name:
          - "DNS:{{ item.role }}.dc-{{ item.env }}.consul"
          - "DNS:localhost"
          - "IP:127.0.0.1"
      loop:
        - { role: server, env: dev }
        - { role: server, env: prod }
        - { role: client, env: dev }
        - { role: client, env: prod }
      loop_control:
        label: "consul {{ item.role }} ({{ item.env }})"

    - name: Sign Consul Server/Client Certs With Consul CA
      community.crypto.x509_certificate:
        path: "{{ pki_dir }}/consul-{{ item.role }}-cert-{{ item.env }}.pem"
        csr_path: "{{ pki_dir }}/consul-{{ item.role }}-csr-{{ item.env }}.pem"
        provider: ownca
        ownca_path: "{{ pki_dir }}/consul-ca-cert.pem"
        ownca_privatekey_path: "{{ pki_dir }}/consul-ca-key.pem"
        ownca_not_after: "+825d"
        mode: "0644"
      loop:
        - { role: server, env: dev }
        - { role: server, env: prod }
        - { role: client, env: dev }
        - { role: client, env: prod }
      loop_control:
        label: "consul {{ item.role }} ({{ item.env }})"

    # --- Nomad Server + Client Certs, Shared Across Both Environments ---
    - name: Generate Nomad Server/Client Private Keys (Region "global", Shared)
      community.crypto.openssl_privatekey:
        path: "{{ pki_dir }}/nomad-{{ item }}-key.pem"
        type: RSA
        size: 4096
        mode: "0600"
      loop: [server, client]

    - name: Generate Nomad Server/Client CSRs (Nomad SAN Convention, region=global)
      community.crypto.openssl_csr:
        path: "{{ pki_dir }}/nomad-{{ item }}-csr.pem"
        privatekey_path: "{{ pki_dir }}/nomad-{{ item }}-key.pem"
        common_name: "{{ item }}.global.nomad"
        subject_alt_name:
          - "DNS:{{ item }}.global.nomad"
          - "DNS:localhost"
          - "IP:127.0.0.1"
      loop: [server, client]

    - name: Sign Nomad Server/Client Certs With Nomad CA
      community.crypto.x509_certificate:
        path: "{{ pki_dir }}/nomad-{{ item }}-cert.pem"
        csr_path: "{{ pki_dir }}/nomad-{{ item }}-csr.pem"
        provider: ownca
        ownca_path: "{{ pki_dir }}/nomad-ca-cert.pem"
        ownca_privatekey_path: "{{ pki_dir }}/nomad-ca-key.pem"
        ownca_not_after: "+825d"
        mode: "0644"
      loop: [server, client]

    # --- Per-Environment Consul Gossip Encryption Keys ---
    # Kept Separate Per Env (Not Shared) So A Compromise Of Dev's Key
    # Doesn't Expose Prod's Gossip Traffic — The Two Clusters Never Talk
    # To Each Other Anyway.
    - name: Check For Existing Gossip Keys (Idempotent — Don't Regenerate If Already In Secret Manager)
      ansible.builtin.command: >
        gcloud secrets versions access latest
        --secret=consul-gossip-key-{{ item }} --project={{ gcp_project_id }}
      register: gossip_key_existing
      loop: [dev, prod]
      no_log: true
      changed_when: false
      failed_when: false

    - name: Generate New Gossip Key For Dev (Only If None Exists Yet)
      ansible.builtin.command: openssl rand -base64 32
      register: gossip_key_dev_generated
      no_log: true
      changed_when: false
      when: gossip_key_existing.results[0].rc != 0

    - name: Generate New Gossip Key For Prod (Only If None Exists Yet)
      ansible.builtin.command: openssl rand -base64 32
      register: gossip_key_prod_generated
      no_log: true
      changed_when: false
      when: gossip_key_existing.results[1].rc != 0

    - name: Write Freshly-Generated Dev Gossip Key To Secret Manager
      ansible.builtin.shell: >
        echo -n "{{ gossip_key_dev_generated.stdout }}" |
        gcloud secrets versions add consul-gossip-key-dev
        --data-file=- --project={{ gcp_project_id }}
      when: gossip_key_existing.results[0].rc != 0
      no_log: true
      changed_when: true

    - name: Write Freshly-Generated Prod Gossip Key To Secret Manager
      ansible.builtin.shell: >
        echo -n "{{ gossip_key_prod_generated.stdout }}" |
        gcloud secrets versions add consul-gossip-key-prod
        --data-file=- --project={{ gcp_project_id }}
      when: gossip_key_existing.results[1].rc != 0
      no_log: true
      changed_when: true

    # --- Push Consul Client Cert + Key To Secret Manager (Env-Specific, MIG Startup Script Reads These) ---
    - name: Check For Existing Consul Client Certs In Secret Manager
      ansible.builtin.command: >
        gcloud secrets versions access latest
        --secret=consul-client-cert-{{ item }} --project={{ gcp_project_id }}
      register: consul_client_cert_existing
      loop: [dev, prod]
      changed_when: false
      failed_when: false

    - name: Write Consul Client Certs To Secret Manager (Only If Not Already Present)
      ansible.builtin.shell: >
        cat {{ pki_dir }}/consul-client-cert-{{ item.item }}.pem |
        gcloud secrets versions add consul-client-cert-{{ item.item }}
        --data-file=- --project={{ gcp_project_id }}
      loop: "{{ consul_client_cert_existing.results }}"
      loop_control:
        label: "consul-client-cert-{{ item.item }}"
      when: item.rc != 0
      changed_when: true

    - name: Check For Existing Consul Client Keys In Secret Manager
      ansible.builtin.command: >
        gcloud secrets versions access latest
        --secret=consul-client-key-{{ item }} --project={{ gcp_project_id }}
      register: consul_client_key_existing
      loop: [dev, prod]
      no_log: true
      changed_when: false
      failed_when: false

    - name: Write Consul Client Keys To Secret Manager (Only If Not Already Present)
      ansible.builtin.shell: >
        cat {{ pki_dir }}/consul-client-key-{{ item.item }}.pem |
        gcloud secrets versions add consul-client-key-{{ item.item }}
        --data-file=- --project={{ gcp_project_id }}
      loop: "{{ consul_client_key_existing.results }}"
      loop_control:
        label: "consul-client-key-{{ item.item }}"
      when: item.rc != 0
      no_log: true
      changed_when: true

    - name: Report PKI Bootstrap Outcome
      ansible.builtin.debug:
        msg: >-
          CAs and certs generated in {{ pki_dir }}. Consul server certs and
          Nomad server/client certs will be distributed directly by
          nomad-servers.yml / the Packer bake from these local files.
          Consul client cert/key + gossip keys (per environment) have been
          written to Secret Manager for the MIG startup script to fetch.
