---
# Run Against: role_mgmt Group (Dynamic Inventory). mgmt-vm Has No env
# Label, So dev.yaml/prod.yaml Group Vars Never Apply Here, Since
# Vault/Octopus/The Runner Are Environment-Independent Singletons.

- name: Configure The Management VM
  hosts: role_mgmt
  become: true
  vars:
    docker_extra_group_users: ["gh-runner"]
    common_install_gcloud_cli: true
  roles:
    - common
    - vault
    # - github-runner
    - docker
    - octopus
  tasks:
    - name: Vault Backup Service On mgmt-vm
      ansible.builtin.include_role:
        name: vault
        tasks_from: backup

    - name: Octopus Deploy Backup Service On mgmt-vm
      ansible.builtin.include_role:
        name: octopus
        tasks_from: backup

    - name: Mount Docker Data Disk On mgmt-vm
      ansible.builtin.include_role:
        name: docker
        tasks_from: mount-docker-data-disk
      vars:
        docker_data_disk_name: mgmt-vm-docker-data

    - name: Schedule Docker Prune On mgmt-vm
      ansible.builtin.include_role:
        name: docker
        tasks_from: schedule-docker-prune