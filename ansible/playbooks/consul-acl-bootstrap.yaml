---
# Run Against: role_nomad_server Group, ONCE PER ENVIRONMENT — Use
# `--limit dev` Or `--limit prod` Explicitly (Run This Playbook Twice,
# Once Per Env). Bootstraps The First Server In Whatever Scope --limit
# Gives It. Idempotent Via Secret Manager's Own Pre-Check, Same Pattern
# As playbooks/vault-init.yaml.
#
# NOTE: This Only Produces The ROOT Token and Terraform Operator Token. Ongoing Policies (Admin Token,
# Traefik's Read-Only Token, Client/Server Agent Tokens) Are Created By
# terraform/platform-config, Which Reads This Root Token Back From Secret
# Manager To Authenticate The Consul Provider. Run This Playbook BEFORE
# platform-config.

- name: Bootstrap Consul ACLs (Run Once Per Environment Via --limit)
  hosts: role_control_plane
  become: true
  roles:
    - role: consul
      tasks_from: acl-bootstrap.yaml
