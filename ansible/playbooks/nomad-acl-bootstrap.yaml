---
# Run Against: role_nomad_server Group, ONCE PER ENVIRONMENT — Use
# `--limit dev` Or `--limit prod` Explicitly (Run This Playbook Twice,
# Once Per Env). Same Pattern As consul-acl-bootstrap.yaml And
# playbooks/vault-init.yaml.
#
# NOTE: This Only Produces The ROOT and Operator Admin token.
# Ongoing Policies (Admin Token, nomad-sentinel/octopus-deploy/github-runner Tokens)
# Are Created By terraform/platform-config. Run This Playbook BEFORE platform-config.

- name: Bootstrap Nomad ACLs (Run Once Per Environment Via --limit)
  hosts: role_control_plane
  become: true
  tasks:
    - name: Nomad ACL Bootstrap
      ansible.builtin.include_role:
        name: nomad
        tasks_from: acl-bootstrap