---
# Dual Purpose:
#   1. Invoked Directly Against role_nomad_client (Dynamic Inventory) If
#      You Ever Need To Reconfigure A Live Client Node By Hand.
#   2. Invoked By Packer's ansible Provisioner Against The Ephemeral Build
#      VM To Bake The Shared nomad-client-mig Image — In That Context No
#      env-Specific Group Vars Are In Scope (The Build VM Isn't Part Of
#      This Dynamic Inventory), So consul.hcl/nomad Config Templates Omit
#      datacenter/retry_join, And The GCP Startup Script Supplies Them In
#      99-instance.hcl At Real Boot. See roles/consul And roles/nomad
#      Template Comments For Detail.
#
#      Packer Generates Its Own Single-Host Inventory For The Build VM,
#      Which Won't Contain The role_nomad_client Group — Invoke Packer's
#      ansible Provisioner With `-e target_hosts=all` So This Play Matches
#      That Inventory Instead Of Falling Through With Zero Matched Hosts.
#
#      PREREQUISITE: scripts/generate-and-push-pki.sh Must Have Been Run
#      At Least Once Before The First Packer Build (Or Any Direct Run) —
#      Every TLS Secret Fetched Below Must Already Exist In Secret
#      Manager. Unlike The Old pki-local/ Design, There's No Longer An
#      mgmt.yml-Before-nomad Ordering Requirement — Vault's Cert Is Now
#      Also Centrally Generated By That Script, Not Fetched Back From A
#      Live mgmt-vm.
#
#      packer-builder-sa Needs secretAccessor On consul-ca-cert,
#      nomad-ca-cert, nomad-client-cert, nomad-client-key, And vault-cert
#      Since The Bake Itself Fetches These Directly (Running As That SA
#      On The Temp Build VM).

- name: Configure Nomad Client Nodes
  hosts: "{{ target_hosts | default('role_nomad_client') }}"
  become: true
  vars:
    consul_mode: client
    nomad_mode: client
    docker_extra_group_users: ["nomad"]
    common_install_gcloud_cli: true
  roles:
    - common
    - consul
    - nomad
    - docker
    - falco
