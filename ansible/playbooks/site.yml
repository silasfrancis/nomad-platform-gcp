---
# Full Bootstrap — Chains mgmt.yml, nomad-servers.yml, And
# nomad-clients.yml In Order (Order Between These Three No Longer Matters
# — Each Fetches Everything It Needs Directly From Secret Manager, So
# There's No Cross-Playbook File Handoff Anymore). Deliberately Does NOT
# Include vault-init.yml — That's A Separate One-Time Step Run By Hand
# After This (Needs Vault Already Up And Configured First, Which This
# Playbook Does Provide Via mgmt.yml).
#
# REAL PREREQUISITE: scripts/generate-and-push-pki.sh Must Have Been Run
# At Least Once, Ever, Before Any Of This — Every Role Fetches Its TLS
# Material Directly From Secret Manager And Has Nothing To Fall Back To
# If Those Secrets Don't Exist Yet.
#
# Run With: ansible-playbook playbooks/site.yml
# Then, Once: ansible-playbook playbooks/vault-init.yml
# Then: Apply The Terraform service-config Layer.

- name: Full Platform Bootstrap
  import_playbook: mgmt.yml

- name: Full Platform Bootstrap (Nomad Servers)
  import_playbook: nomad-servers.yml

- name: Full Platform Bootstrap (Nomad Clients)
  import_playbook: nomad-clients.yml

- name: Full Platform Bootstrap (Public Traefik)
  import_playbook: traefik-public.yml
