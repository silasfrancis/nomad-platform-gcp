# Docker Compose — Platform / Infrastructure (Local Development Only)
#
# Contains everything that ISN'T an Online Boutique application service:
# infrastructure dependencies (Redis, PostgreSQL) and custom platform
# tooling we built ourselves (metrics-api, ai-agent).
#
# Healthchecks ARE defined here, consistently, because every service in
# this file either has native tooling to support one (PostgreSQL's
# pg_isready, Redis's redis-cli) or is our own code built on a base image
# that includes a shell and wget (metrics-api, ai-agent both use
# python:3.12-slim). This is the deliberate counterpart to
# docker-compose.services.yml, which intentionally has NO healthchecks —
# see that file's header for why.
#
# Run together with the services file:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up --build
#
# Or use the combined shortcut documented in the top-level README.
#
# Usage:
#   cp .env.example .env        # fill in real values
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up --build
#
# ============================================================================

services:
  # ============================================================================
  # METRICS-API + POSTGRES
  # Not part of Online Boutique. Custom platform-engineering demo service —
  # see the top-level README section "Why metrics-api exists" for the full
  # rationale. In short: Online Boutique has no real database dependency,
  # so it can't demonstrate Vault's dynamic database secrets engine.
  # metrics-api exists purely to consume short-lived, auto-rotated
  # PostgreSQL credentials issued live by Vault, proving the full
  # dynamic-secret lifecycle.
  #
  # Locally, Vault doesn't exist yet, so metrics-api connects with static
  # credentials from .env — the local stand-in for what Vault will issue
  # dynamically once this moves to Nomad.
  # ============================================================================
  metrics-api:
    build:
      context: ./apps/metrics-api
      dockerfile: Dockerfile
    image: local/metrics-api:dev
    container_name: metrics-api
    ports:
      - "8090:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://${METRICS_DB_USER}:${METRICS_DB_PASSWORD}@metrics-postgres:5432/${METRICS_DB_NAME}"
    depends_on:
      metrics-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - boutique-net

  metrics-postgres:
    image: postgres:16-alpine
    container_name: metrics-postgres
    environment:
      POSTGRES_USER: "${METRICS_DB_USER}"
      POSTGRES_PASSWORD: "${METRICS_DB_PASSWORD}"
      POSTGRES_DB: "${METRICS_DB_NAME}"
    volumes:
      - metrics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METRICS_DB_USER} -d ${METRICS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - boutique-net

  # ============================================================================
  # AI MONITORING AGENT
  # Standalone platform tool — see ai-agent/README.md for full design.
  # NOMAD_ADDR is intentionally left pointing at host.docker.internal so
  # this container can reach a Nomad dev agent running natively on your
  # host machine (`nomad agent -dev`), since Nomad needs direct access to
  # the host's process/container runtime and should not itself be
  # containerized for local testing.
  #
  # IMPORTANT: `nomad agent -dev` binds to 127.0.0.1 by default, which is
  # NOT reachable from inside a container even with host-gateway mapped.
  # Run it with `nomad agent -dev -bind=0.0.0.0` (or your platform's
  # equivalent loopback override) so the agent container can actually
  # reach it. See ai-agent/README.md.
  #
  # REMEDIATION_MODE=propose is the safe local default — this stack has no
  # real Nomad cluster to mutate, and propose mode is what prod will run
  # anyway, so it's the more representative default for local testing.
  #
  # No healthcheck — this is a monitoring tool, not a dependency of any
  # other service, so nothing in the stack needs to wait on it.
  # ============================================================================
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    image: local/ai-agent:dev
    container_name: ai-agent
    environment:
      NOMAD_ADDR: "${NOMAD_ADDR:-http://host.docker.internal:4646}"
      NOMAD_TOKEN: "${NOMAD_TOKEN}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
      ENVIRONMENT: "local"
      REMEDIATION_MODE: "${REMEDIATION_MODE:-propose}"
      # Anomaly history — reuses metrics-api's PostgreSQL instance, a
      # separate table (agent_anomalies). Optional: the agent runs fine
      # with this unset, it just won't persist anomaly history. See
      # ai-agent/README.md "Anomaly history" section.
      HISTORY_DATABASE_URL: "postgresql://${METRICS_DB_USER}:${METRICS_DB_PASSWORD}@metrics-postgres:5432/${METRICS_DB_NAME}"
    depends_on:
      metrics-postgres:
        condition: service_healthy
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux too;
      # Docker Desktop (Mac/Windows) provides this automatically.
      - "host.docker.internal:host-gateway"
    networks:
      - boutique-net
    restart: unless-stopped

networks:
  boutique-net:
    driver: bridge

volumes:
  metrics-postgres-data:
