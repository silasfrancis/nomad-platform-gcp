# monitoring/prometheus/prometheus.yml
#
# Consul catalog SD throughout, not static targets — this same config
# runs unchanged in both dev and prod (baked into one image, promoted
# through environments); it only ever sees whichever Consul cluster
# its own container's local agent is joined to. Static IPs would go
# stale the moment a MIG scales; catalog SD doesn't.
#
# Vault is a documented scrape target (architecture doc 8.2) but is
# NOT included here — it lives on mgmt-vm, outside this cluster
# entirely, and the existing firewall table only opens mgmt -> env,
# not the reverse direction a scrape would need. Left out rather than
# included and silently broken. If this gets solved, Vault would need
# its own scrape job here, reached via the same "internal" Traefik
# entrypoint pattern used for Prometheus's/Loki's own Grafana access —
# not a Consul SD job, since Vault isn't in this cluster's catalog.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node Exporter — one per client node (system job), tagged
  # implicitly by its own service name in Consul.
  - job_name: node-exporter
    consul_sd_configs:
      - server: "localhost:8500"
        services: ["node-exporter"]

  # Traefik — traefik-internal's dev-internal/prod-internal instances
  # register themselves in this same Consul cluster under these
  # names (see the traefik role's defaults/main.yaml static_routes).
  - job_name: traefik
    consul_sd_configs:
      - server: "localhost:8500"
        services: ["nomad-dev", "nomad-prod", "consul-dev", "consul-prod"]
    metrics_path: /metrics

  # Every application service (Online Boutique + metrics-api +
  # nomad-sentinel) shares the "metrics" Consul tag — one job here
  # covers all of them rather than one entry per service, so a new
  # boutique service never needs a Prometheus config change to start
  # being scraped.
  - job_name: application-services
    consul_sd_configs:
      - server: "localhost:8500"
        tags: ["metrics"]
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service

  # Nomad's own /metrics endpoint — one entry per server in this
  # cluster (1 in dev, up to 3 in prod), via Consul catalog SD against
  # the "consul" service Consul itself registers for its own servers
  # (which run on the same instances as the Nomad servers in this
  # project).
  - job_name: nomad
    consul_sd_configs:
      - server: "localhost:8500"
        services: ["consul"]
    metrics_path: /v1/metrics
    params:
      format: ["prometheus"]

  # Consul's own /v1/agent/metrics — same target instances as above,
  # different path.
  - job_name: consul
    consul_sd_configs:
      - server: "localhost:8500"
        services: ["consul"]
    metrics_path: /v1/agent/metrics
    params:
      format: ["prometheus"]
