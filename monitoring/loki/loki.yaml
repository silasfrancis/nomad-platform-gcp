# loki.yaml

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki

  storage:
    gcs:
      bucket_name: ${LOKI_GCS_BUCKET}

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  object_prefix: ${LOKI_GCS_PREFIX}

  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h

  gcs:
    bucket_name: ${LOKI_GCS_BUCKET}

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h

limits_config:
  retention_period: 720h
