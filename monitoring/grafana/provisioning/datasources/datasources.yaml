# All 4 reached through traefik-internal's dedicated "internal"
# entrypoint with real Let's Encrypt certs throughout, so no custom TLS config needed on any of them.

apiVersion: 1

datasources:
  - name: "Prometheus (dev)"
    type: prometheus
    access: proxy
    url: "https://prometheus-dev.platform.lefrancis.org:8446"
    isDefault: false
    editable: false

  - name: "Prometheus (prod)"
    type: prometheus
    access: proxy
    url: "https://prometheus-prod.platform.lefrancis.org:8447"
    isDefault: true
    editable: false

  - name: "Loki (dev)"
    type: loki
    access: proxy
    url: "https://loki-dev.platform.lefrancis.org:8446"
    isDefault: false
    editable: false

  - name: "Loki (prod)"
    type: loki
    access: proxy
    url: "https://loki-prod.platform.lefrancis.org:8447"
    isDefault: false
    editable: false
